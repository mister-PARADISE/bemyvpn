plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Ключ для Google Play читаем из keystore.properties — файл НЕ в репозитории
// (см. .gitignore). Нет файла — release собирается отладочным ключом, как раньше,
// чтобы прямая раздача APK продолжала работать без ключа.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

/// Версия релиза: env BMV_VERSION («1.2»), иначе «0.0» для локальных сборок —
/// так видно, что собрано не из тега, и такая сборка не выдаёт себя за релиз.
def bmvVersionName() {
    def v = System.getenv('BMV_VERSION')
    return (v == null || v.trim().isEmpty()) ? '0.0' : v.trim()
}

/// versionCode для Android — целое, обязано РАСТИ, иначе система считает сборку
/// откатом и не ставит её. «major.minor.patch» → major*10000 + minor*100 + patch.
def bmvVersionCode() {
    def parts = bmvVersionName().split('\\.')
    def num = { i -> i < parts.length ? (parts[i].replaceAll('[^0-9]', '') ?: '0') as int : 0 }
    // Не ниже 1: у локальной сборки версия «0.0», а Android отвергает
    // versionCode 0 и вообще не даёт собрать APK.
    return Math.max(1, num(0) * 10000 + num(1) * 100 + num(2))
}

android {
    // Версия сборки нужна коду для сравнения с последним релизом.
    buildFeatures { buildConfig true }
    namespace 'org.bemyvpn'
    compileSdk 35

    defaultConfig {
        applicationId 'org.bemyvpn'
        minSdk 24
        // Google Play не принимает сборки со старым targetSdk. 33 отклонялся.
        targetSdk 35
        // Версия берётся из тега релиза (env BMV_VERSION, CI отдаёт «1.2» из «v1.2»).
        // Захардкоженная версия означала, что ВСЕ релизы для системы одинаковы:
        // обновление не считалось обновлением. versionCode — целое, поэтому
        // «1.2» → 10200 (major*10000 + minor*100 + patch), монотонно растёт.
        versionName bmvVersionName()
        versionCode bmvVersionCode()
        ndk {
            abiFilters 'arm64-v8a'
        }
    }


    signingConfigs {
        if (keystorePropsFile.exists()) {
            upload {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // отладочная сборка — быстрая, без минификации (для разработки)
        }
        release {
            // Боевая сборка: R8 срезает неиспользуемый код androidx/kotlin и
            // ресурсы — APK заметно меньше БЕЗ потери функционала (JNI-мост
            // защищён правилами в proguard-rules.pro).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Есть keystore.properties → подписываем боевым ключом (для Google
            // Play, он отладочные подписи не принимает). Нет файла → debug-ключ,
            // как раньше: прямая раздача APK продолжает работать.
            signingConfig keystorePropsFile.exists() ? signingConfigs.upload : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // UI — Jetpack Compose: декларативный, как SwiftUI на iOS. Экраны Android —
    // построчный перенос ContentView.swift, включая анимации и отступы.
    buildFeatures {
        compose true
    }
    composeOptions {
        // Совместим с Kotlin 1.9.24 (см. таблицу compose-kotlin compatibility).
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    // material3 — ТОЛЬКО ради Slider/CircularProgressIndicator (дизайн свой,
    // Material-темизация не используется). R8 срежет остальное.
    implementation 'androidx.compose.material3:material3'
    // Аналоги SF Symbols из iOS-приложения (Shield/Router/Bolt/…). Пакет большой,
    // но R8 в release оставляет только реально использованные иконки.
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    // Генерация QR (zxing:core) + ВСТРОЕННЫЙ сканер камеры (zxing-android-embedded).
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
