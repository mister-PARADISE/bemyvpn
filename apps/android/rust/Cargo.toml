[package]
name = "bmv-android"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# Нативная библиотека для Android: ТОНКИЙ JNI-мост Kotlin ↔ bmv-ffi.
# Вся логика (двухфазный connect, авто-реконнект pump_tunnel, синхронный BYE,
# nudge при смене сети, хост-режим) живёт в crates/bmv-ffi — ОБЩЕМ с iOS.
# Здесь только конвертация JString ↔ C-строки. Поведение платформ идентично.
[lib]
name = "bmv_android"
crate-type = ["cdylib"]

[dependencies]
bmv-ffi = { path = "../../../crates/bmv-ffi" }
jni = "0.21"

# ФОРК ipstack (vendor/ipstack): window scaling + RTO-таймер + MSS — критично
# для скорости (иначе окно ≤64КБ → потолок 64КБ/RTT на соединение).
[patch.crates-io]
ipstack = { path = "../../../vendor/ipstack" }

[profile.release]
# opt-level = 3 — скорость, а не размер. Прежний "z" (минимальный размер) душил
# горячий путь VPN: крипту (AES/ChaCha), userspace TCP-стек и копирование пакетов
# компилировал в мелкий, но медленный код — это был реальный потолок на телефоне.
# .so чуть больше, зато пропускная способность заметно выше (lto+strip держат вес).
opt-level = 3
lto = true
strip = true
panic = "abort"
