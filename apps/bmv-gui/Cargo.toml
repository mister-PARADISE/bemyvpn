# Десктопный GUI BeMyVPN — вид как у Android-приложения (портрет, карточки,
# нижние вкладки), но нативно на Rust через Slint. Использует то же ядро
# `bmv-core` НАПРЯМУЮ (без JNI/JVM/webview) → остаётся один самодостаточный
# бинарь, как весь проект. Разметка — в ui/*.slint (вид отдельно от логики).
[package]
name = "bmv-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bemyvpn-gui"
path = "src/main.rs"

[dependencies]
bmv-core = { path = "../../crates/bmv-core" }
bmv-config = { path = "../../crates/bmv-config" }
# geoip — страна хоста по IP (вшитая база ip2cc.dat). Фича, а не общая часть
# крейта: базу в 490 КБ иначе унёс бы с собой и мост в телефоны, которому она
# не нужна.
bmv-common = { path = "../../crates/bmv-common", features = ["geoip"] }
bmv-signal = { path = "../../crates/bmv-signal" }
# bmv-tunnel здесь больше не нужен: и TUN, и качание трафика поднимает
# bmv-desktop (общий с терминалом путь), а прямых обращений к крейту в src/ и
# tests/ не осталось ни одного. Так же вычищено у bmv-cli.
# Роутинг гостя (TUN + завернуть трафик) — общий с bmv-cli.
bmv-desktop = { path = "../../crates/bmv-desktop" }
# femtovg (GPU) — HiDPI/Retina, сглаживание. Флаги-эмодзи он не умеет, поэтому
# флаги стран рисуем PNG-картинками (см. flags/ + geo.rs), как на Android визуально.
#
# НИЖНЯЯ ГРАНИЦА 1.15 — НЕ ВКУСОВЩИНА, А УСЛОВИЕ РАБОТЫ БЕЗ ВИДЕОКАРТЫ. До 1.15
# программный растеризатор ронял процесс, как только в кадре исчезал хоть один
# элемент (обновился список, погасло `if`): `compute_dirty_regions` держал
# `borrow_mut` кеша геометрии, пока считал габариты элемента, а расчёт габаритов
# лениво достраивал повторитель и сносил старые строки — те лезли в тот же кеш
# вторым `borrow_mut` («RefCell already borrowed», partial_renderer.rs:818).
# Slint 1.15.0 переставил расчёт габаритов ВЫШЕ взятия кеша (issue #9882, PR
# #9883) — перекрытия заимствований не осталось. Сторож — тест
# `the_software_renderer_survives_lists_changing_under_it`.
slint = { version = "1.15" }
# Декод встроенных PNG-флагов в slint::Image.
image = { version = "0.25", default-features = false, features = ["png"] }
# Встраивание папки флагов в бинарь.
include_dir = "0.7"
# Генерация QR-кода приглашения (кнопка QR на вкладке Хост).
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# Буфер обмена — кнопка «вставить код» на вкладке VPN.
arboard = "3"
# Папка конфигурации ОС — стабильный id хоста между запусками (чтобы не плодить
# клоны в каталоге), как device_host_id в prefs на Android.
directories = "5"
# Токен для root-хелпера — из криптостойкого генератора (см. helper.rs).
rand = { workspace = true }
display-info = "0.5.9"

# O_NOFOLLOW при записи файлов обмена с root-хелпером: без него root идёт по
# симлинку, который сосед по машине заранее положил в общий /tmp (см. helper.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Системное окно с ошибкой, когда окно приложения поднять не вышло: у релиза под
# Windows нет консоли, и eprintln! уходит в никуда (см. report_startup_failure).
# Крейт и так уже в дереве сборки (его тянут winit и directories) — новой ценой
# это не оборачивается.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.15"   # версия компилятора разметки идёт в ногу с slint
# Встраивает Windows-манифест (UAC requireAdministrator + HiDPI) в exe. На не-Windows
# целях no-op, поэтому держим в общих build-deps, а вызываем по target в build.rs.
embed-resource = "3"

[dev-dependencies]
# Безголовая оболочка Slint для тестов окна: даёт настоящее дерево элементов и
# раскладку без экрана. Без неё вылет при переключении вкладок ловился бы только
# руками на живом окне — а он и жил там четыре версии подряд.
i-slint-backend-testing = "1.15"
