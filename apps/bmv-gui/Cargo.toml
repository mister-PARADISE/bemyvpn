# Десктопный GUI BeMyVPN — вид как у Android-приложения (портрет, карточки,
# нижние вкладки), но нативно на Rust через Slint. Использует то же ядро
# `bmv-core` НАПРЯМУЮ (без JNI/JVM/webview) → остаётся один самодостаточный
# бинарь, как весь проект. Разметка — в ui/*.slint (вид отдельно от логики).
[package]
name = "bmv-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bemyvpn-gui"
path = "src/main.rs"

[dependencies]
bmv-core = { path = "../../crates/bmv-core" }
bmv-config = { path = "../../crates/bmv-config" }
bmv-common = { path = "../../crates/bmv-common" }
bmv-signal = { path = "../../crates/bmv-signal" }
bmv-tunnel = { path = "../../crates/bmv-tunnel" }
# Роутинг гостя (TUN + завернуть трафик) — общий с bmv-cli.
bmv-desktop = { path = "../../crates/bmv-desktop" }
# femtovg (GPU) — HiDPI/Retina, сглаживание. Флаги-эмодзи он не умеет, поэтому
# флаги стран рисуем PNG-картинками (см. flags/ + geo.rs), как на Android визуально.
slint = { version = "1.8" }
# Декод встроенных PNG-флагов в slint::Image.
image = { version = "0.25", default-features = false, features = ["png"] }
# Встраивание папки флагов в бинарь.
include_dir = "0.7"
# Генерация QR-кода приглашения (кнопка QR на вкладке Хост).
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# Буфер обмена — кнопка «вставить код» на вкладке VPN.
arboard = "3"
# Распаковка встроенной гео-базы ip2cc.dat (флаг страны по IP, как на Android).
flate2 = "1"
# Папка конфигурации ОС — стабильный id хоста между запусками (чтобы не плодить
# клоны в каталоге), как device_host_id в prefs на Android.
directories = "5"

[build-dependencies]
slint-build = "1.8"
# Встраивает Windows-манифест (UAC requireAdministrator + HiDPI) в exe. На не-Windows
# целях no-op, поэтому держим в общих build-deps, а вызываем по target в build.rs.
embed-resource = "3"
