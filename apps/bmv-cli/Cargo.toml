[package]
name = "bmv-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bemyvpn"
path = "src/main.rs"

[dependencies]
# geoip — страна хоста по IP (вшитая база ip2cc.dat): та же колонка «NL»/«US»,
# что и в окне. Фича, потому что мосту в телефоны эти 490 КБ не нужны.
bmv-common = { workspace = true, features = ["geoip"] }
bmv-config.workspace = true
bmv-core.workspace = true
# bmv-tunnel здесь больше не нужен: гостевой туннель поднимает bmv-desktop —
# общий с окном код, а своей копии этого пути в терминале не осталось.
bmv-signal.workspace = true
# Десктопный роутinг гостя (TUN + завернуть трафик) — общий с bmv-gui.
bmv-desktop = { path = "../../crates/bmv-desktop" }
# Режим «Сервер» — тот же бинарь `bemyvpn` поднимает координатор (не отдельный
# бинарь). С фичей tls: сам отдаёт HTTPS по путям из конфига.
bmv-coordinator = { path = "../../server/coordinator" }
clap.workspace = true
tokio.workspace = true
# TUI-меню (запуск без аргументов): вкладки VPN/Хост/Сервер, стрелки, живой статус.
#
# 0.30, А НЕ 0.29, ПО ЧУЖОЙ ПРИЧИНЕ — И ЭТО НЕ ПРИХОТЬ. ratatui 0.29 прибивал
# `unicode-width` РОВНО к 0.2.0 (`=0.2.0`), а окну нужен slint ≥ 1.15 (без него
# машина без видеокарты падает на первом же исчезнувшем элементе, см.
# apps/bmv-gui/Cargo.toml). Компилятор разметки slint 1.15 тянет
# `annotate-snippets`, которому нужен `unicode-width` ≥ 0.2.2, — а лок в
# воркспейсе один на всех. Так что либо терминал переезжает на ratatui 0.30
# (тот пин снял), либо окно остаётся сломанным. Кода правок не потребовалось.
ratatui = "0.30"
# Вслед за ratatui: его backend приехал на crossterm 0.29, и на 0.28 в бинаре
# оказалось ДВЕ копии crossterm — каждая со своим представлением о том, включён
# ли сырой режим и открыт ли альтернативный буфер. Терминал после выхода
# восстанавливает одна, а портит другая.
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
# QR-код приглашения прямо в терминале (юникод-полублоки) — как кнопка QR на iOS.
qrcode = { version = "0.14", default-features = false }

# geteuid: режим 24/7 (systemd-демон) доступен только под root на Linux.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
