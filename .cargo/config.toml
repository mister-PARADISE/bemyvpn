# Windows: статическая линковка MSVC-рантайма (crt-static).
# Без этого exe требует vcruntime140.dll (Visual C++ Redistributable) — на чистой
# Windows выскакивает «не найден vcruntime140.dll». С crt-static рантайм вшит в
# сам exe: скачал → запустил, ничего доустанавливать не нужно (как и wintun.dll,
# которая уже вшита через bmv-desktop::ensure_wintun).
#
# ПРИЗНАК, А НЕ ПЕРЕЧЕНЬ ЦЕЛЕЙ. Раньше здесь стояло `[target.x86_64-pc-windows-msvc]`,
# и когда добавили сборку под Windows-ARM (aarch64-pc-windows-msvc), правило на неё
# не распространилось: ARM-exe уехал в релиз без вшитого рантайма и у человека с
# Windows on ARM встретил ровно то системное окно, от которого эта строка и защищает.
# `cfg(windows)` закрывает ЛЮБУЮ Windows-цель, включая те, которых ещё нет.
#
# Подвох, о котором стоит знать: секции `[target.<triple>]` и `[target.'cfg(...)']`
# не вытесняют друг друга, а СКЛАДЫВАЮТСЯ (первый непустой источник флагов —
# переменная RUSTFLAGS, и он бы вытеснил обе). То есть если завтра кому-то
# понадобится доп. флаг под одну конкретную цель, он допишет её секцию, и crt-static
# отсюда никуда не денется.
#
# Сборочные скрипты и процедурные макросы. Ничего не меняется по сравнению с
# прежней записью по имени цели: CI собирает Windows НА Windows и без `--target`,
# а тогда cargo считает целью сам хост — признак совпадает, и флаг получают все
# единицы сборки, включая build.rs (проверено: `cargo check -v`). При настоящей
# кросс-сборке (`--target`) хостовые единицы флага не получают, и это правильно —
# рантайм нужен вшитым в тот exe, что уезжает людям, а build.rs исполняется на
# сборочной машине, где MSVC и так стоит.
#
# Сторож в CI смотрит НЕ СЮДА, а в таблицу импортов готового exe (tools/check-windows-exe.py):
# правильный конфиг ещё не значит, что флаг доехал до линкера.
[target.'cfg(windows)']
rustflags = ["-C", "target-feature=+crt-static"]
