# BeMyVPN — раздача интернета из контейнера.
#
#   docker compose up -d          запустить
#   docker compose logs -f        посмотреть, что происходит
#   docker compose down           остановить
#
# Больше ничего настраивать не нужно: имя берётся от машины, лимит гостей
# подбирается по объёму памяти, всё сохраняется само.

services:
  bemyvpn-host:
    build:
      context: .
      # Своя версия вместо свежей: VERSION=v1.46
      args:
        VERSION: latest
    image: bemyvpn-host:latest
    container_name: bemyvpn-host

    # ── ПОЧЕМУ host, А НЕ ОБЫЧНАЯ СЕТЬ DOCKER ────────────────────────────────
    # Связь с гостем строится пробитием NAT: обе стороны узнают свой внешний
    # адрес через STUN и бьют друг другу навстречу с ТОГО ЖЕ сокета. Мост Docker
    # ставит поверх домашнего/провайдерского NAT ещё один, свой: наружу уходит
    # подменённый порт, и координатор назовёт гостю адрес, по которому нас нет.
    # Пробрасывать порты вручную бесполезно — порт заранее неизвестен, его
    # выбирает система при открытии сокета.
    #
    # Поэтому сеть хозяина. Это НЕ дыра в безопасности: контейнер не открывает
    # входящих портов (соединение к координатору исходящее), внутренние адреса
    # гостю закрыты самим приложением, и процесс работает не от root.
    network_mode: host

    restart: unless-stopped

    # Конфиг переживает пересоздание контейнера. Здесь лежат id хоста и токен
    # владения записью в каталоге — потеряете том, и хост станет другим:
    # выданный друзьям код сети перестанет работать.
    volumes:
      - bemyvpn-config:/config

    # ── Необязательное ───────────────────────────────────────────────────────
    # command: ["host", "--tunnel", "--name", "Моя раздача", "--max", "16"]
    #
    #   --name "…"     своё имя в каталоге вместо имени машины
    #   --max 16       свой лимит гостей вместо подобранного по памяти
    #   --hidden       не показываться в общем списке (только по коду)
    #   --password …   пароль на вход; тогда сеть всегда скрытая
    #
    # Помогать только своим: раскомментируйте строку ниже, возьмите код из
    # логов (`docker compose logs`) и раздайте его тем, кому доверяете.
    # command: ["host", "--tunnel", "--hidden"]

    # Потолок ресурсов — на случай, если машина ещё чем-то занята.
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bemyvpn-config:
