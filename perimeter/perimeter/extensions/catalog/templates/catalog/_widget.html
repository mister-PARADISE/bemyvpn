<div class="card-body">
  <dl class="kv">
    <dt>пассивные</dt><dd class="tnum">{{ passive }}</dd>
    <dt>активные</dt><dd class="tnum">{{ active }}</dd>
    <dt>типы данных</dt><dd class="tnum">{{ types }}</dd>
  </dl>
</div>
{% if broken %}
<div class="card-body" style="border-top:1px solid var(--line)">
  <div class="note tone-danger">{{ icon('alert') }}<div>Не загрузилось: {{ broken|map(attribute='name')|join(', ') }}</div></div>
</div>
{% elif not passive and not active %}
<div class="card-body" style="border-top:1px solid var(--line)">
  <div class="note">{{ icon('info') }}<div>Модулей пока нет. Первыми будут WHOIS, DNS и поддомены</div></div>
</div>
{% endif %}
