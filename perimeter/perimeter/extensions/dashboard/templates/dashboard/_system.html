<div class="card-body">
  <dl class="kv">
    {% for key, value in rows %}<dt>{{ key }}</dt><dd class="tnum">{{ value }}</dd>{% endfor %}
    <dt>расширения</dt>
    <dd>{% if broken %}<span class="t-err">{{ broken|length }} с ошибкой</span>{% else %}<span class="t-ok">{{ extensions }} ok</span>{% endif %}</dd>
  </dl>
</div>
