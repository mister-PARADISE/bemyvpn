{# Монитор как в htop: обновляется из JS раз в 2 с (app.js → watchMonitor) #}
<div class="mon" data-monitor>
  {% for r in rows %}
  <div class="mon-row" data-key="{{ r.key }}"{% if r.pct is defined %} data-pct="{{ r.pct }}"{% endif %}>
    <span class="mon-k">{{ r.key }}</span>
    {%- if r.bar is not none %}<span class="mon-bar t-{{ r.tone }}">[<span data-bar>{{ r.bar }}</span>]</span>{% endif -%}
    <span class="mon-v" data-text>{{ r.text }}</span>
  </div>
  {% endfor %}
</div>
