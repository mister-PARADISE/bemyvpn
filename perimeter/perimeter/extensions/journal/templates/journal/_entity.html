<div class="card" id="journal">
  <div class="card-head"><h2>{{ icon('history') }}История</h2></div>
  {% if entries %}
  <ul class="log">
    {% for e in entries %}
    {% set mark, tone = level(e.action) %}
    <li>
      <span class="when" title="{{ e.at|dt }}">{{ (e.at|dt)[:5] }}</span>
      <span class="what"><span class="lvl tone-{{ tone }}">{{ mark }}</span>{{ e.summary }}</span>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <div class="card-body muted small"># записей пока нет</div>
  {% endif %}
</div>
