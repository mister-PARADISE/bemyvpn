{% if latest %}
<div class="card-body"><dl class="kv"><dt>всего</dt><dd class="tnum">{{ total }}</dd></dl></div>
<div class="list" style="border-top:1px solid var(--line)">
  {% for t in latest %}
    <a class="item" href="/targets/{{ t.id }}">
      <span class="item-ico">{{ icon('globe') }}</span>
      <span class="cell grow"><span class="l1"><span>{{ t.name }}</span></span><span class="l2">{{ t.title or t.updated_at|ago }}</span></span>
    </a>
  {% endfor %}
</div>
{% else %}
<div class="card-body"><a class="btn-soft btn-sm" href="/targets/new">{{ icon('plus') }}Добавить первую цель</a></div>
{% endif %}
