<title>Воксельный мир</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: full-screen canvas; HUD top-left, menu top-right, touch controls along the bottom edge. */
  :root {
    --ink: #e9eef2;
    --ink-dim: #a9b6c0;
    --panel: rgba(14, 22, 30, 0.72);
    --panel-edge: rgba(180, 210, 230, 0.18);
    --accent: #8fd3a6;
    --warn: #ffb36b;
    --font-ui: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-num: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0e161e; color: var(--ink); }
  body { font-family: var(--font-ui); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(12px, env(safe-area-inset-left, 0px)); padding: 8px 12px; font-size: 13px; line-height: 1.45; pointer-events: none; max-width: 60vw; }
  #hud b { font-weight: 700; }
  #hud .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink-dim); font-size: 12px; }
  #menuBtn { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: max(12px, env(safe-area-inset-right, 0px)); }
  button, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 12px; min-height: 44px; min-width: 44px; padding: 0 14px; }
  button:active { background: rgba(60, 90, 110, 0.85); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #menu { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 62px); right: max(12px, env(safe-area-inset-right, 0px)); width: min(320px, calc(100vw - 24px)); padding: 12px; display: grid; gap: 10px; font-size: 14px; max-height: calc(100% - 140px); overflow-y: auto; }
  #menu label { display: grid; gap: 4px; color: var(--ink-dim); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
  #menu select, #menu input[type=range] { width: 100%; }
  #menu .row { display: flex; gap: 8px; }
  #menu .row > * { flex: 1; }
  #menu .note { color: var(--ink-dim); font-size: 12px; line-height: 1.4; }
  #stick { position: fixed; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); width: 132px; height: 132px; border-radius: 50%; pointer-events: none; opacity: 0.85; }
  #stick .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(220, 235, 245, 0.35); background: rgba(14, 22, 30, 0.25); }
  #stick .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(220, 235, 245, 0.55); }
  #pad { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: grid; gap: 10px; }
  #pad button { width: 58px; height: 58px; border-radius: 50%; font-size: 20px; padding: 0; }
  #pad #fast.on { border-color: var(--accent); color: var(--accent); }
  #loader { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: #0e161e; }
  #loader h1 { font-size: 22px; margin: 0 0 8px; text-wrap: balance; }
  #loader p { color: var(--ink-dim); margin: 0; max-width: 34ch; line-height: 1.5; }
  #loader.err h1 { color: var(--warn); }
  .hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 160px); transform: translateX(-50%); padding: 8px 12px; font-size: 13px; color: var(--ink-dim); text-align: center; pointer-events: none; transition: opacity 0.6s; max-width: calc(100vw - 40px); }
  @media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
  @media (hover: hover) and (pointer: fine) { #stick, #pad .touch-only { display: none; } }
</style>

<canvas id="cv"></canvas>
<div id="hud" class="panel" hidden><b id="hBiome">—</b><br><span class="num" id="hNums"></span></div>
<button id="menuBtn" aria-expanded="false" aria-controls="menu" hidden>☰ Меню</button>
<div id="menu" class="panel" hidden>
  <label for="seedSel">Мир
    <select id="seedSel">
      <option value="42">Мир 42</option>
      <option value="1">Мир 1</option>
      <option value="2026">Мир 2026</option>
      <option value="custom">Свой seed…</option>
    </select>
  </label>
  <div class="row" id="customRow" hidden>
    <input id="customSeed" type="number" inputmode="numeric" placeholder="например 777" aria-label="Свой seed" style="min-height:44px;border-radius:12px;border:1px solid var(--panel-edge);background:var(--panel);color:var(--ink);padding:0 10px">
    <button id="customGo">Создать</button>
  </div>
  <label for="bmSel">Красивые места
    <select id="bmSel"></select>
  </label>
  <label for="tod">Время суток
    <input id="tod" type="range" min="2" max="88" value="35">
  </label>
  <label for="dist">Дальность (чанки по 32 блока)
    <input id="dist" type="range" min="3" max="12" value="7">
  </label>
  <p class="note">Бета-версия: рядом настоящие блоки, генерация идёт прямо на телефоне. Дальний план, тени и вода красивее будут в следующей версии по этой же ссылке.</p>
</div>
<div id="stick"><div class="ring"></div><div class="knob" id="knob"></div></div>
<div id="pad">
  <button id="up" aria-label="Вверх" class="touch-only">▲</button>
  <button id="down" aria-label="Вниз" class="touch-only">▼</button>
  <button id="fast" aria-label="Быстро">⚡</button>
</div>
<div class="hint panel" id="hint" hidden>Левый палец — движение, правый — обзор. ▲▼ — высота, ⚡ — скорость</div>
<div id="loader"><div><h1 id="lTitle">Строю мир…</h1><p id="lText">Генератор запускается прямо на устройстве.</p></div></div>

<script>
'use strict';
(() => {
const $ = (id) => document.getElementById(id);
const BIOMES = ['Глубокий океан','Океан','Тёплый океан','Холодный океан','Пляж','Снежный пляж','Каменистый берег','Река','Ледяная река','Болото','Равнина','Луг','Лес','Березняк','Тёмный лес','Тайга','Старая тайга','Снежная тайга','Тундра','Джунгли','Саванна','Пустыня','Бедленд','Худу','Альпийская роща','Снежные склоны','Скалистые пики','Снежные пики','Ледник','Вулканическое плато'];

function fail(title, text) {
  const l = $('loader'); l.hidden = false; l.classList.add('err');
  $('lTitle').textContent = title; $('lText').textContent = text;
}
if (typeof WebAssembly === 'undefined') { fail('WebAssembly недоступен', 'Этот браузер или страница не разрешает WebAssembly. Напиши об этом в чат — сделаю версию без него.'); return; }
const cv = $('cv');
const gl = cv.getContext('webgl2', { antialias: true, powerPreference: 'high-performance' });
if (!gl) { fail('WebGL2 недоступен', 'Нужен браузер с поддержкой WebGL2 (Safari 15+, Chrome). Напиши в чат, какой у тебя браузер.'); return; }

let ex = null, mem = null, bookmarks = {};
const HAZE = 9000;
const st = { seed: 42, x: 0, y: 200, z: 0, yaw: 0, pitch: -0.2, tod: 35, R: 7, fast: false };

// ---------------- shaders
const VS = `#version 300 es
layout(location=0) in uvec4 a0; layout(location=1) in uvec4 a1; layout(location=2) in uvec4 a2;
uniform mat4 uVP; uniform vec3 uOrg;
out vec3 vW; flat out uint vN; flat out uint vMat; out float vAO; out vec3 vTint; out float vSky;
void main(){
  vec3 p = vec3(float(a0.x), float(a0.z + a0.w * 256u), float(a0.y));
  vW = p + uOrg; vN = a1.x; vMat = a1.y; vAO = float(a1.z);
  vTint = pow(vec3(a2.xyz) / 255.0, vec3(2.2)); vSky = float(a2.w) / 255.0;
  gl_Position = uVP * vec4(vW, 1.0);
}`;
const FS = `#version 300 es
precision highp float; precision highp int;
in vec3 vW; flat in uint vN; flat in uint vMat; in float vAO; in vec3 vTint; in float vSky;
uniform vec4 uMat[48]; uniform vec3 uSun; uniform vec3 uCam; uniform int uKind; uniform float uFogD;
uniform vec3 uSkyH; uniform vec3 uSkyZ; uniform vec3 uSunC; uniform float uTime;
out vec4 o;
const vec3 NRM[6] = vec3[6](vec3(1,0,0),vec3(-1,0,0),vec3(0,1,0),vec3(0,-1,0),vec3(0,0,1),vec3(0,0,-1));
float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
vec3 sky(vec3 d){
  float h = clamp(d.y, -0.2, 1.0);
  vec3 c = mix(uSkyH, uSkyZ, pow(max(h, 0.0), 0.55));
  float s = max(dot(d, uSun), 0.0);
  c += uSunC * (pow(s, 8.0) * 0.12 + pow(s, 900.0) * 6.0);
  return c;
}
void main(){
  vec3 n = NRM[vN];
  vec3 V = vW - uCam; float d = length(V); vec3 vd = V / d;
  vec3 blk = floor(vW - n * 0.5);
  vec3 tex = floor((vW - n * 0.01) * 16.0) / 16.0;
  float t = h3(tex * 7.13 + float(vMat));
  float fade = clamp(d / 140.0, 0.0, 1.0);           // texture detail fades with distance (no shimmer)
  vec4 mt = uMat[vMat];
  if (uKind == 2 && t < 0.16 && d < 90.0) discard;   // leaf holes only up close
  vec3 alb = mt.rgb * vTint * mix(0.84 + 0.32 * t, 1.0, fade) * (0.94 + 0.12 * h3(blk));
  float ao = 0.35 + 0.65 * vAO / 3.0;
  float lam = max(dot(n, uSun), 0.0);
  vec3 amb = mix(uSkyH, uSkyZ, 0.5 + 0.5 * n.y) * (0.55 + 0.45 * vSky);
  vec3 col = alb * (uSunC * lam * mix(0.2, 1.0, vSky) * 1.6 + amb * ao * 1.1 + vec3(0.03));
  if ((int(mt.a) & 4) != 0) col += alb * 2.5;
  float alpha = 1.0;
  if (uKind == 1) {
    vec2 w = vW.xz * 0.35 + uTime * vec2(0.3, 0.2);
    vec3 wn = normalize(vec3(sin(w.x) * 0.06 + sin(w.y * 1.7) * 0.04, 1.0, cos(w.y) * 0.06 + cos(w.x * 1.3) * 0.04));
    float fr = 0.02 + 0.98 * pow(1.0 - max(dot(-vd, wn), 0.0), 5.0);
    vec3 refl = sky(reflect(vd, wn));
    vec3 deep = vec3(0.02, 0.09, 0.16) * (0.5 + 0.5 * vSky) + uSunC * 0.01;
    col = mix(deep, refl, fr);
    alpha = mix(0.72, 1.0, fr);
  }
  float f = 1.0 - exp(-d / uFogD);
  col = mix(col, sky(normalize(vec3(vd.x, max(vd.y, 0.02), vd.z))), f);
  col = col / (1.0 + col * 0.85);
  o = vec4(pow(col, vec3(1.0 / 2.2)), alpha);
}`;
const SKY_VS = `#version 300 es
out vec2 vP; void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2) * 2.0 - 1.0; vP = p; gl_Position = vec4(p, 0.9999, 1.0); }`;
const SKY_FS = `#version 300 es
precision highp float; in vec2 vP; uniform mat4 uInvVP; uniform vec3 uCam; uniform vec3 uSun; uniform vec3 uSkyH; uniform vec3 uSkyZ; uniform vec3 uSunC; out vec4 o;
void main(){
  vec4 a = uInvVP * vec4(vP, 1.0, 1.0); vec3 d = normalize(a.xyz / a.w - uCam);
  float h = clamp(d.y, -0.2, 1.0);
  vec3 c = mix(uSkyH, uSkyZ, pow(max(h, 0.0), 0.55));
  if (d.y < 0.0) c = mix(uSkyH, uSkyH * 0.7, min(-d.y * 4.0, 1.0));
  float s = max(dot(d, uSun), 0.0);
  c += uSunC * (pow(s, 8.0) * 0.12 + pow(s, 900.0) * 6.0);
  c = c / (1.0 + c * 0.85);
  o = vec4(pow(c, vec3(1.0 / 2.2)), 1.0);
}`;
function prog(vs, fs) {
  const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace('[0]', ''); u[nm] = gl.getUniformLocation(p, nm); }
  return { p, u };
}
// far terrain: interleaved [x,y,z, nx,ny,nz, r,g,b, wet]
const FAR_VS = `#version 300 es
layout(location=0) in vec3 aP; layout(location=1) in vec3 aN; layout(location=2) in vec3 aC; layout(location=3) in float aW;
uniform mat4 uVP; uniform vec3 uCam; uniform float uCurv;
out vec3 vW; out vec3 vN; out vec3 vC; out float vWet;
void main(){
  vec3 p = aP;
  vec2 dxz = p.xz - uCam.xz;
  p.y -= dot(dxz, dxz) * uCurv;                       // earth curvature d²/2R
  vW = p; vN = aN; vC = aC; vWet = aW;
  gl_Position = uVP * vec4(p, 1.0);
}`;
const FAR_FS = `#version 300 es
precision highp float;
in vec3 vW; in vec3 vN; in vec3 vC; in float vWet;
uniform vec3 uCam; uniform vec3 uSun; uniform vec3 uSkyH; uniform vec3 uSkyZ; uniform vec3 uSunC;
uniform vec4 uHole; uniform float uHaze; uniform float uTime;
out vec4 o;
vec3 sky(vec3 d){
  float h = clamp(d.y, -0.2, 1.0);
  vec3 c = mix(uSkyH, uSkyZ, pow(max(h, 0.0), 0.55));
  float s = max(dot(d, uSun), 0.0);
  return c + uSunC * (pow(s, 8.0) * 0.12 + pow(s, 900.0) * 6.0);
}
void main(){
  vec2 rel = vW.xz - uHole.xy;
  if (uHole.w > 0.5) { if (max(abs(rel.x), abs(rel.y)) < uHole.z) discard; }   // inside a finer ring
  else if (length(vW.xz - uCam.xz) < uHole.z) discard;                          // inside voxel radius
  vec3 V = vW - uCam; float d = length(V); vec3 vd = V / d;
  vec3 n = normalize(vN);
  vec3 col;
  if (vWet > 0.5) {
    vec2 w = vW.xz * 0.02 + uTime * 0.05;
    vec3 wn = normalize(vec3(sin(w.x) * 0.02, 1.0, cos(w.y) * 0.02));
    float fr = 0.02 + 0.98 * pow(1.0 - max(dot(-vd, wn), 0.0), 5.0);
    col = mix(vec3(0.02, 0.08, 0.15), sky(reflect(vd, wn)), fr);
  } else {
    float lam = max(dot(n, uSun), 0.0);
    vec3 amb = mix(uSkyH, uSkyZ, 0.5 + 0.5 * n.y);
    col = vC * (uSunC * lam * 1.6 + amb * 0.9 + vec3(0.03));
  }
  float f = 1.0 - exp(-d / uHaze);
  col = mix(col, sky(normalize(vec3(vd.x, max(vd.y, 0.01), vd.z))), f);
  col = col / (1.0 + col * 0.85);
  o = vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
}`;
let P, S, F;
try { P = prog(VS, FS); S = prog(SKY_VS, SKY_FS); F = prog(FAR_VS, FAR_FS); } catch (e) { fail('Ошибка шейдера', String(e.message || e)); return; }
const skyVao = gl.createVertexArray();

// ---------------- far rings (built in a worker from the same wasm)
const FAR_N = 128;
const RINGS = [4, 16, 128].map((cell) => ({ cell, mesh: null, pending: false, cx: NaN, cz: NaN }));
const farIdx = (() => {
  const S1 = FAR_N + 1, a = new Uint16Array(FAR_N * FAR_N * 6); let o = 0;
  for (let j = 0; j < FAR_N; j++) for (let i = 0; i < FAR_N; i++) {
    const v = j * S1 + i; a[o++] = v; a[o++] = v + S1; a[o++] = v + 1; a[o++] = v + 1; a[o++] = v + S1; a[o++] = v + S1 + 1;
  }
  const b = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, b); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, a, gl.STATIC_DRAW); return b;
})();
const WORKER_SRC = `
let ex = null, q = Promise.resolve();
onmessage = (e) => { q = q.then(() => handle(e.data)).catch((err) => postMessage({ type: 'err', msg: String(err) })); };
async function handle(m) {
  if (m.type === 'init') {
    if (!ex && m.bytes) ex = (await WebAssembly.instantiate(m.bytes, {})).instance.exports;
    if (!ex) return;
    ex.vw_init(m.seedLo >>> 0, m.seedHi >>> 0); return;
  }
  if (m.type === 'far') {
    const n = m.n, S = n + 1, cell = m.cell;
    // build with a 1-cell margin for normals
    ex.vw_build_far(cell, m.x0 - cell, m.z0 - cell, n + 2);
    const S2 = n + 3;
    const dv = new DataView(ex.memory.buffer, ex.vw_far_ptr(), S2 * S2 * 16);
    const H = new Float32Array(S2 * S2), W = new Uint8Array(S2 * S2), C = new Uint8Array(S2 * S2 * 3);
    for (let k = 0; k < S2 * S2; k++) {
      const h = dv.getFloat32(k * 16, true), w = dv.getFloat32(k * 16 + 4, true);
      const wet = w > h + 0.2; W[k] = wet ? 1 : 0; H[k] = wet ? w : h;
      C[k * 3] = dv.getUint8(k * 16 + 8); C[k * 3 + 1] = dv.getUint8(k * 16 + 9); C[k * 3 + 2] = dv.getUint8(k * 16 + 10);
    }
    const out = new Float32Array(S * S * 10);
    const lin = (b) => Math.pow(b / 255, 2.2);
    for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
      const k = (j + 1) * S2 + (i + 1), o = (j * S + i) * 10;
      const hx = H[k + 1] - H[k - 1], hz = H[k + S2] - H[k - S2];
      let nx = -hx, ny = 2 * cell, nz = -hz; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
      out[o] = m.x0 + i * cell; out[o + 1] = H[k]; out[o + 2] = m.z0 + j * cell;
      out[o + 3] = nx; out[o + 4] = ny; out[o + 5] = nz;
      out[o + 6] = lin(C[k * 3]); out[o + 7] = lin(C[k * 3 + 1]); out[o + 8] = lin(C[k * 3 + 2]);
      out[o + 9] = W[k];
    }
    postMessage({ type: 'far', ring: m.ring, gen: m.gen, cx: m.cx, cz: m.cz, buf: out.buffer }, [out.buffer]);
  }
}`;
let farWorker = null, farGen = 0;
function farUpload(r, buf) {
  if (r.mesh) { gl.deleteBuffer(r.mesh.vb); gl.deleteVertexArray(r.mesh.vao); }
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(buf), gl.STATIC_DRAW);
  const st4 = 40;
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, st4, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, st4, 12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, st4, 24);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 1, gl.FLOAT, false, st4, 36);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, farIdx);
  gl.bindVertexArray(null);
  r.mesh = { vao, vb };
}
function farRequest() {
  if (!farWorker) return;
  RINGS.forEach((r, ri) => {
    const span = r.cell * FAR_N, snap = r.cell * 8;
    const cx = Math.round(st.x / snap) * snap, cz = Math.round(st.z / snap) * snap;
    const moved = !(Math.abs(cx - r.cx) < span * 0.2 && Math.abs(cz - r.cz) < span * 0.2);
    if (r.pending || !moved) return;
    r.pending = true;
    farWorker.postMessage({ type: 'far', ring: ri, gen: farGen, cell: r.cell, n: FAR_N, x0: cx - span / 2, z0: cz - span / 2, cx, cz });
  });
}

// shared quad index buffer
const MAXQ = 1 << 16;
const idx = new Uint32Array(MAXQ * 6);
for (let q = 0; q < MAXQ; q++) { const b = 4 * q, o = 6 * q; idx[o] = b; idx[o+1] = b+1; idx[o+2] = b+2; idx[o+3] = b; idx[o+4] = b+2; idx[o+5] = b+3; }
const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);

// ---------------- chunks
const chunks = new Map();
let buildMsAvg = 0;
function freeChunk(c) { for (const k of c.kinds) if (k) { gl.deleteBuffer(k.vb); gl.deleteVertexArray(k.vao); } }
function clearChunks() { for (const c of chunks.values()) freeChunk(c); chunks.clear(); }
function buildChunk(cx, cz) {
  const t0 = performance.now();
  ex.vw_build_chunk(cx, cz);
  const kinds = [];
  for (let k = 0; k < 3; k++) {
    const len = ex.vw_mesh_len(k);
