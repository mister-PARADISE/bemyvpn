<title>Воксельный мир</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: full-screen canvas; HUD top-left, menu top-right, touch controls along the bottom edge. */
  :root {
    --ink: #e9eef2;
    --ink-dim: #a9b6c0;
    --panel: rgba(14, 22, 30, 0.72);
    --panel-edge: rgba(180, 210, 230, 0.18);
    --accent: #8fd3a6;
    --warn: #ffb36b;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-num: ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0e161e; color: var(--ink); }
  body { font-family: var(--font-ui); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  .panel { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(12px, env(safe-area-inset-left, 0px)); padding: 8px 12px; font-size: 13px; line-height: 1.45; pointer-events: none; max-width: 62vw; }
  #hud b { font-weight: 700; }
  #hud .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink-dim); font-size: 12px; }
  #menuBtn { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: max(12px, env(safe-area-inset-right, 0px)); }
  button, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 12px; min-height: 44px; min-width: 44px; padding: 0 14px; }
  button:active { background: rgba(60, 90, 110, 0.85); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #menu { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 62px); right: max(12px, env(safe-area-inset-right, 0px)); width: min(320px, calc(100vw - 24px)); padding: 12px; display: grid; gap: 10px; font-size: 14px; max-height: calc(100% - 140px); overflow-y: auto; }
  #menu label { display: grid; gap: 4px; color: var(--ink-dim); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
  #menu select, #menu input[type=range] { width: 100%; }
  #menu .row { display: flex; gap: 8px; }
  #menu .row > * { flex: 1; min-width: 0; }
  #menu .note { color: var(--ink-dim); font-size: 12px; line-height: 1.45; margin: 0; }
  #customSeed { min-height: 44px; border-radius: 12px; border: 1px solid var(--panel-edge); background: var(--panel); color: var(--ink); padding: 0 10px; font: inherit; }
  #stick { position: fixed; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; pointer-events: none; opacity: 0.85; left: calc(max(18px, env(safe-area-inset-left, 0px)) + 66px); top: calc(100% - env(safe-area-inset-bottom, 0px) - 84px); }
  #stick .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(220, 235, 245, 0.35); background: rgba(14, 22, 30, 0.25); }
  #stick .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(220, 235, 245, 0.55); }
  #pad { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: grid; gap: 10px; }
  #pad button { width: 58px; height: 58px; border-radius: 50%; font-size: 20px; padding: 0; }
  #pad #fast.on { border-color: var(--accent); color: var(--accent); }
  #loader { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: #0e161e; }
  #loader h1 { font-size: 22px; margin: 0 0 8px; text-wrap: balance; }
  #loader p { color: var(--ink-dim); margin: 0; max-width: 36ch; line-height: 1.5; }
  #loader.err h1 { color: var(--warn); }
  #hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 14px; font-size: 14px; color: var(--ink); text-align: center; pointer-events: none; transition: opacity 0.6s; max-width: calc(100vw - 40px); line-height: 1.5; }
  #cross { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; opacity: 0.55; }
  #cross::before, #cross::after { content: ""; position: absolute; background: #fff; }
  #cross::before { left: 6px; top: 0; width: 2px; height: 14px; }
  #cross::after { top: 6px; left: 0; height: 2px; width: 14px; }
  @media (prefers-reduced-motion: reduce) { #hint { transition: none; } }
  @media (hover: hover) and (pointer: fine) { #stick, #pad .touch-only { display: none; } }
  @media (hover: none), (pointer: coarse) { .desk-only { display: none; } }
</style>

<canvas id="cv"></canvas>

  <label for="seedSel">Мир
    <select id="seedSel">
      <option value="42">Мир 42</option>

  <p class="note">Рядом — настоящие блоки, дальше — те же блоки покрупнее, до ~24 км. Мир генерируется прямо на устройстве.</p>

<script>
'use strict';
(() => {
const $ = (id) => document.getElementById(id);
const BIOMES = ['Глубокий океан','Океан','Тёплый океан','Холодный океан','Пляж','Снежный пляж','Каменистый берег','Река','Ледяная река','Болото','Равнина','Луг','Лес','Березняк','Тёмный лес','Тайга','Старая тайга','Снежная тайга','Тундра','Джунгли','Саванна','Пустыня','Бедленд','Худу','Альпийская роща','Снежные склоны','Скалистые пики','Снежные пики','Ледник','Вулканическое плато'];
const IS_TOUCH = matchMedia('(hover: none), (pointer: coarse)').matches;

function fail(title, text) {
  const l = $('loader'); l.hidden = false; l.classList.add('err');
  $('lTitle').textContent = title; $('lText').textContent = text;
}
if (typeof WebAssembly === 'undefined') { fail('WebAssembly недоступен', 'Этот браузер или страница не разрешает WebAssembly. Напиши об этом в чат.'); return; }
const cv = $('cv');
const gl = cv.getContext('webgl2', { antialias: true, powerPreference: 'high-performance' });
if (!gl) { fail('WebGL2 недоступен', 'Нужен браузер с поддержкой WebGL2 (Safari 15+, Chrome). Напиши в чат, какой у тебя браузер.'); return; }

const QUALITY = [
  { R: 8, shadow: 1024, scale: 1.0 },
  { R: 12, shadow: 2048, scale: 1.25 },
  { R: 16, shadow: 2048, scale: 1.5 },
];
const st = { seed: 42, x: 0, y: 200, z: 0, yaw: 0, pitch: -0.2, tod: 35, sunAz: 210, q: 1, fast: false, sens: 8 };
let bookmarks = {}, wasmBytes = null, ready = false;

// =====================================================================================
// Shaders
// =====================================================================================
const COMMON_GLSL = `
uniform vec3 uSun; uniform vec3 uSkyH; uniform vec3 uSkyZ; uniform vec3 uSunC; uniform float uHaze; uniform vec3 uCam;
float h3(vec3 p){ p = fract(p * 0.3183099 + vec3(0.71, 0.113, 0.419)); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float h2(vec2 p){ return h3(vec3(p, 3.17)); }
vec3 skyCol(vec3 d){
  float h = clamp(d.y, -0.25, 1.0);
  vec3 c = mix(uSkyH, uSkyZ, pow(max(h, 0.0), 0.5));
  if (h < 0.0) c = mix(uSkyH, uSkyH * vec3(0.78, 0.82, 0.88), min(-h * 5.0, 1.0));
  float s = max(dot(d, uSun), 0.0);
  c += uSunC * (pow(s, 6.0) * 0.10 + pow(s, 48.0) * 0.25);
  return c;
}
vec3 aerial(vec3 col, vec3 wpos){
  vec3 V = wpos - uCam; float d = length(V); vec3 vd = V / max(d, 1e-3);
  // exponential height fog: thinner air higher up
  float hAvg = max(0.0, 0.5 * (wpos.y + uCam.y) - 140.0);
  float dens = exp(-hAvg / 900.0);
  float f = 1.0 - exp(-d * dens / uHaze);
  vec3 fogc = skyCol(normalize(vec3(vd.x, max(vd.y, 0.015), vd.z)));
  float s = max(dot(vd, uSun), 0.0);
  fogc += uSunC * pow(s, 10.0) * 0.25;
  return mix(col, fogc, f);
}
vec3 tonemap(vec3 c){
  c *= 0.62;
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  c = max(mix(vec3(l), c, 1.12), 0.0);                       // a touch more saturation
  vec3 a = c * (2.51 * c + 0.03); vec3 b = c * (2.43 * c + 0.59) + 0.14;
  return pow(clamp(a / b, 0.0, 1.0), vec3(1.0 / 2.2));
}`;

// ---------- voxel chunks: 12-byte vertices (see web/API.md)
const VS = `#version 300 es
layout(location=0) in uvec4 a0; layout(location=1) in uvec4 a1; layout(location=2) in uvec4 a2;
uniform mat4 uVP; uniform vec3 uOrg;
out vec3 vW; flat out uint vN; flat out uint vMat; out float vAO; out vec3 vTint; out float vSky;
void main(){
  vec3 p = vec3(float(a0.x), float(a0.z + a0.w * 256u), float(a0.y));
  vW = p + uOrg; vN = a1.x; vMat = a1.y; vAO = float(a1.z);
  vTint = pow(vec3(a2.xyz) / 255.0, vec3(2.2)); vSky = float(a2.w) / 255.0;
  gl_Position = uVP * vec4(vW, 1.0);
}`;
const FS = `#version 300 es
precision highp float; precision highp int; precision highp sampler2DShadow;
in vec3 vW; flat in uint vN; flat in uint vMat; in float vAO; in vec3 vTint; in float vSky;
uniform vec4 uMat[48]; uniform int uKind; uniform float uTime;
uniform sampler2DShadow uShadow; uniform mat4 uShadowVP; uniform float uShadowOn; uniform float uShadowTexel;
out vec4 o;
${COMMON_GLSL}
const vec3 NRM[6] = vec3[6](vec3(1,0,0),vec3(-1,0,0),vec3(0,1,0),vec3(0,-1,0),vec3(0,0,1),vec3(0,0,-1));
const vec3 TERRA[8] = vec3[8](vec3(0.31,0.11,0.06), vec3(0.36,0.09,0.02), vec3(0.64,0.44,0.36), vec3(0.50,0.24,0.02), vec3(0.27,0.05,0.03), vec3(0.24,0.15,0.12), vec3(0.07,0.03,0.02), vec3(0.31,0.11,0.06));
float shadowAt(vec3 wp, vec3 n){
  if (uShadowOn < 0.5) return 1.0;
  vec4 s = uShadowVP * vec4(wp + n * 0.08 + uSun * 0.05, 1.0);
  vec3 c = s.xyz / s.w * 0.5 + 0.5;
  if (c.x <= 0.0 || c.x >= 1.0 || c.y <= 0.0 || c.y >= 1.0 || c.z >= 1.0) return 1.0;
  float t = uShadowTexel, r = 0.0;
  r += texture(uShadow, vec3(c.xy + vec2(-0.6, -0.6) * t, c.z));
  r += texture(uShadow, vec3(c.xy + vec2( 0.6, -0.6) * t, c.z));
  r += texture(uShadow, vec3(c.xy + vec2(-0.6,  0.6) * t, c.z));
  r += texture(uShadow, vec3(c.xy + vec2( 0.6,  0.6) * t, c.z));
  return r * 0.25;
}
// procedural 16x16 pixel textures: returns albedo multiplier/colour for this texel
vec3 surface(uint mat, vec3 base, vec3 tint, vec3 wp, vec3 n, out float holes){
  holes = 1.0;
  vec3 blk = floor(wp - n * 0.5);
  vec2 uv = abs(n.x) > 0.5 ? wp.zy : (abs(n.y) > 0.5 ? wp.xz : wp.xy);
  vec2 tx = floor(fract(uv) * 16.0);                        // texel 0..15
  float ty = 15.0 - floor(fract(wp.y) * 16.0);              // rows from block top (for side faces)
  float h = h3(vec3(tx, 1.0) + blk * 1.37 + float(mat) * 7.1);
  float h2v = h3(vec3(floor(tx / 4.0), 2.0) + blk * 2.11 + float(mat));
  bool top = n.y > 0.5, side = abs(n.y) < 0.5;
  vec3 c = base * tint;
  float m = 1.0;
  if (mat == 8u || mat == 11u) {                            // grass / moss
    if (side) {
      float fringe = 3.0 + floor(h3(vec3(tx.x, 5.0, 0.0) + blk) * 2.5);
      if (ty >= fringe) c = uMat[7].rgb, m = 0.82 + 0.32 * h - (h < 0.08 ? 0.25 : 0.0);
      else m = 0.78 + 0.34 * h;
    } else m = 0.76 + 0.36 * h + (h > 0.93 ? 0.18 : 0.0);
  } else if (mat == 7u || mat == 9u || mat == 10u) {        // dirt, podzol, mud
    m = 0.8 + 0.34 * h - (h < 0.09 ? 0.3 : 0.0);
  } else if (mat == 1u || mat == 2u || mat == 4u || mat == 5u || mat == 38u || mat == 3u) { // rock
    float crack = h3(vec3(tx.x + tx.y * 0.5, 9.0, 0.0) + blk) < 0.05 ? 0.72 : 1.0;
    m = (0.84 + 0.12 * h2v + 0.12 * h) * crack;
  } else if (mat == 6u) { m = 0.92 + 0.1 * h;               // calcite
  } else if (mat == 12u || mat == 13u) { m = 0.9 + 0.14 * h; // sand
  } else if (mat == 14u || mat == 15u) {                    // sandstone layers
    m = (mod(ty, 4.0) < 1.0 && side ? 0.86 : 1.0) * (0.93 + 0.09 * h);
  } else if (mat == 16u) {                                  // gravel pebbles
    float p = h3(vec3(floor(tx / 2.0), 4.0) + blk);
    m = 0.62 + 0.62 * p;
  } else if (mat == 18u) { m = 0.96 + 0.05 * h;             // snow
  } else if (mat == 19u || mat == 20u) { m = 0.95 + 0.06 * h2v; // ice
  } else if (mat == 23u) {                                  // terracotta bands by y
    int bi = int(mod(floor(wp.y / 3.0) * 5.0 + floor(h3(vec3(floor(wp.y / 3.0), 1.0, 2.0)) * 8.0), 8.0));
    c = TERRA[bi]; m = 0.92 + 0.12 * h;
  } else if (mat == 24u || mat == 28u || mat == 30u || mat == 32u || mat == 34u || mat == 26u) { // logs
    if (side) {
      float stripe = h3(vec3(tx.x, 3.0, 0.0) + vec3(blk.x, 0.0, blk.z));
      m = 0.7 + 0.42 * stripe + 0.1 * h;
      if (mat == 26u && h < 0.12) m = 0.25;                 // birch dashes
    } else {
      float d = length(tx - 7.5);
      m = 0.82 + 0.18 * sin(d * 1.7) ;
      c = mix(c, c * vec3(1.35, 1.2, 1.0), d < 6.0 ? 1.0 : 0.0);
    }
  } else if (mat == 25u || mat == 27u || mat == 29u || mat == 31u || mat == 33u || mat == 35u) { // leaves
    float cl = h3(vec3(floor(tx / 2.0), 6.0) + blk);
    m = 0.6 + 0.55 * cl + 0.15 * h;
    if (h < 0.17 && cl < 0.5) holes = 0.0;
  } else if (mat == 36u) { m = mod(tx.x, 4.0) < 1.0 ? 0.7 : 1.0 + 0.1 * h;
  } else if (mat == 39u) { m = 0.8 + 0.4 * h;
  } else { m = 0.88 + 0.22 * h; }
  // distance mip: fade texel detail when a texel is smaller than a pixel
  float fw = max(length(fwidth(uv * 16.0)), 1e-4);
  float detail = clamp(1.5 - fw, 0.0, 1.0);
  m = mix(1.0, m, detail);
  return c * m * (0.96 + 0.08 * h3(blk + 11.0));
}
void main(){
  vec3 n = NRM[vN];
  vec4 mt = uMat[vMat];
  float holes;
  vec3 alb = surface(vMat, mt.rgb, vTint, vW, n, holes);
  float d = length(vW - uCam);
  if (uKind == 2 && holes < 0.5 && d < 120.0) discard;
  float ao = 0.35 + 0.65 * vAO / 3.0;
  float sh = shadowAt(vW, n);
  float lam = max(dot(n, uSun), 0.0);
  vec3 sky = mix(uSkyH, uSkyZ, 0.5 + 0.5 * n.y) * (0.45 + 0.55 * vSky);
  vec3 bounce = vec3(0.32, 0.28, 0.22) * max(0.0, -n.y * 0.5 + 0.3) * uSunC.r * 0.25;
  vec3 col = alb * (uSunC * lam * sh * 1.9 + sky * ao * 0.7 + bounce * ao + vec3(0.015) * ao);
  if ((int(mt.a) & 4) != 0) col += alb * 3.0;
  float alpha = 1.0;
  if (uKind == 1) {
    vec3 V = normalize(vW - uCam);
    vec2 w1 = vW.xz * 0.28 + uTime * vec2(0.33, 0.21), w2 = vW.xz * 0.61 - uTime * vec2(0.17, 0.29);
    vec3 wn = normalize(vec3(sin(w1.x) * 0.05 + sin(w2.y) * 0.035, 1.0, cos(w1.y) * 0.05 + cos(w2.x) * 0.035));
    float fr = 0.02 + 0.98 * pow(1.0 - max(dot(-V, wn), 0.0), 5.0);
    vec3 refl = skyCol(reflect(V, wn));
    float spec = pow(max(dot(reflect(V, wn), uSun), 0.0), 220.0) * sh * 4.0;
    vec3 deep = vec3(0.015, 0.075, 0.13) * (0.5 + 0.5 * vSky) * (0.6 + 0.4 * uSunC.r);
    col = mix(deep, refl, fr) + uSunC * spec;
    alpha = mix(0.78, 1.0, fr);
  }
  col = aerial(col, vW);
  o = vec4(tonemap(col), alpha);
}`;

// ---------- blocky LOD rings: 16-byte vertices [f32 x, f32 y, f32 z, u8 r,g,b, u8 nrm|wet<<3|cell(log2)<<4]
const LVS = `#version 300 es
layout(location=0) in vec3 aP; layout(location=1) in uvec4 aC;
uniform mat4 uVP; uniform vec3 uCamL; uniform float uCurv;
out vec3 vW; flat out uint vN; flat out float vWet; out vec3 vC; flat out float vCell;
void main(){
  vec3 p = aP;
  vec2 dxz = p.xz - uCamL.xz;
  vW = p;
  p.y -= dot(dxz, dxz) * uCurv;                 // earth curvature d²/2R
  vN = aC.w & 7u; vWet = float((aC.w >> 3) & 1u); vCell = exp2(float(aC.w >> 4));
  vC = pow(vec3(aC.xyz) / 255.0, vec3(2.2));
  gl_Position = uVP * vec4(p, 1.0);
}`;
const LFS = `#version 300 es
precision highp float; precision highp sampler2DShadow;
in vec3 vW; flat in uint vN; flat in float vWet; in vec3 vC; flat in float vCell;
uniform vec4 uHole; uniform float uTime;
uniform sampler2DShadow uShadow; uniform mat4 uShadowVP; uniform float uShadowOn;
uniform sampler2D uMask; uniform vec3 uMaskO;
out vec4 o;
${COMMON_GLSL}
const vec3 NRM[6] = vec3[6](vec3(1,0,0),vec3(-1,0,0),vec3(0,1,0),vec3(0,-1,0),vec3(0,0,1),vec3(0,0,-1));
void main(){
  vec2 rel = vW.xz - uHole.xy;
  if (uHole.w > 0.5 && max(abs(rel.x), abs(rel.y)) < uHole.z) discard;   // a finer ring covers this
  vec2 mc = (vW.xz - uMaskO.xy) / 32.0;                                    // loaded voxel chunk here?
  if (mc.x >= 0.0 && mc.y >= 0.0 && mc.x < uMaskO.z && mc.y < uMaskO.z && texelFetch(uMask, ivec2(mc), 0).r > 0.5) discard;
  vec3 n = NRM[vN];
  vec3 cellId = floor((vW - n * 0.25) / vCell);
  float jit = h3(cellId * 1.31 + 5.0);
  vec3 col;
  if (vWet > 0.5) {
    vec3 V = normalize(vW - uCam);
    vec2 w = vW.xz * 0.05 + uTime * 0.06;
    vec3 wn = normalize(vec3(sin(w.x) * 0.02 + sin(w.y * 1.7) * 0.015, 1.0, cos(w.y) * 0.02));

        $('lText').textContent = `Блоков вокруг: ${near} · дальних колец: ${rings}/${RINGS.length}`;
