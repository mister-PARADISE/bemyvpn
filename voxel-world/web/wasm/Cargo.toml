[package]
name = "vw_web"
version = "0.1.0"
edition = "2021"
description = "WebAssembly build of the voxel-world generator: chunk mesher + far tiles for the web viewer"

# Standalone workspace (independent of the main crate's build).
[workspace]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
voxel-world = { path = "../.." }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
opt-level = 2
