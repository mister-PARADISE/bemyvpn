[package]
name = "vw_tools"
version = "0.1.0"
edition = "2021"
description = "Native helpers for the web viewer (bookmarks export)"

# Standalone workspace (independent of the main crate's build).
[workspace]

[[bin]]
name = "bookmarks"
path = "src/bookmarks.rs"

[dependencies]
voxel-world = { path = "../.." }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
