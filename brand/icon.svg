<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Иконка приложения: глиф «Звено» на фирменной тёмной плитке.
       Скругление плитки — под платформу (iOS маскирует сам, здесь rx=22 для превью). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101726"/><stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6EA2FF"/><stop offset="1" stop-color="#3D6FE0"/>
    </linearGradient>
    <linearGradient id="gG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3EE6A8"/><stop offset="1" stop-color="#14B981"/>
    </linearGradient>
    <mask id="lensTop" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="black"/>
      <circle cx="37" cy="50" r="19" fill="none" stroke="white" stroke-width="11"/>
      <rect y="50" width="100" height="50" fill="black"/>
    </mask>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <circle cx="63" cy="50" r="19" fill="none" stroke="url(#gG)" stroke-width="11"/>
  <circle cx="37" cy="50" r="19" fill="none" stroke="url(#gB)" stroke-width="11"/>
  <g mask="url(#lensTop)">
    <circle cx="63" cy="50" r="19" fill="none" stroke="url(#gG)" stroke-width="11"/>
  </g>
</svg>
