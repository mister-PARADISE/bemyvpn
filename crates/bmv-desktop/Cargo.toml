# Десктопная платформенная часть режима VPN-гостя: создание TUN и заворачивание
# ВСЕГО трафика в туннель с откатом на Drop. Общий код для CLI (bmv-cli) и
# GUI (bmv-gui) — чтобы роутинг жил в ОДНОМ месте, а не дублировался. Ядро
# (bmv-core/bmv-tunnel) остаётся платформенно-независимым; это — только десктоп.
[package]
name = "bmv-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bmv-tunnel = { path = "../bmv-tunnel" }
# `bmv_common::command` — единая точка порождения процессов (на Windows она
# гасит мигающее окно консоли у route/netsh) и `bmv_common::view` — общий
# справочник правил показа (годность хоста в переборе кандидатов).
bmv-common = { path = "../bmv-common" }
# Гостевой перебор кандидатов и дерево задач раздачи (tunnel.rs / hosting.rs):
# они одинаковы для GUI и терминала, поэтому живут здесь, а не в бинаре.
bmv-core = { path = "../bmv-core" }
bmv-config = { path = "../bmv-config" }
bmv-signal = { path = "../bmv-signal" }
# Тип хаба (UdpHub), который возвращает host_bind_announce и держит раздача.
bmv-net = { path = "../bmv-net" }
# Для TunDevice-адаптера (AsyncRead/AsyncWrite поверх tun::AsyncDevice: снятие
# 4-байтового utun-заголовка на macOS).
tokio = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tun = { workspace = true }
