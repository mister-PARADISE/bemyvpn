[package]
name = "bmv-config"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bmv-common.workspace = true
serde.workspace = true
toml.workspace = true

# chown: под sudo вернуть конфиг владельцу, иначе после первого sudo-запуска
# приложение под обычным пользователем молча теряет возможность сохранять.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
