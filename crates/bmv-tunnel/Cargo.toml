[package]
name = "bmv-tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bmv-common.workspace = true
# Таблица адресных диапазонов (`bmv_net::reach`): по ней хост решает, куда ему
# открывать сокет наружу. Своей копии здесь нет — она уже расходилась с чужой.
bmv-net.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
ipstack.workspace = true

[dev-dependencies]
# Сборка настоящих IP-пакетов в тестах: фильтр адресата проверяется через
# `run_host` с реальным пакетом гостя, а не вызовом чистой функции.
# Версия та же, что у ipstack, — в дереве уже есть, лишнего не тянем.
etherparse = { version = "0.19", default-features = false, features = ["std"] }
