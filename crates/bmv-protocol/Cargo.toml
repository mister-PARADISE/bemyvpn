[package]
name = "bmv-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bmv-common.workspace = true
async-trait.workspace = true
# Английский текст ошибки шифрослоя уходит СЮДА, а не в окно: человеку он не
# говорит ничего, а разбирать поломку по нему всё равно надо.
log.workspace = true
tokio.workspace = true
snow.workspace = true
rand.workspace = true
# Деривация маски nonce для «Маскировки» (QUIC-подобная защита шапки). Проверенный
# крейт RustCrypto — свою крипту не пишем. sha2 и так в дереве (snow тянет).
sha2 = "0.10"
curve25519-elligator2 = "0.1.0-alpha.2"

# Флага `webrtc` тут больше нет: его не читал ни один `cfg`, не включал ни один
# крейт и не передавала ни одна сборка — он лишь обещал транспорт, которого нет.
