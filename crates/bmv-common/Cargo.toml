[package]
name = "bmv-common"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
rand.workspace = true
serde = { workspace = true }
serde_json.workspace = true
# ring УБРАН: заводился «под проверку подписи обновлений», которой нет и не
# планируется — обновления и так идут по HTTPS с GitHub, а отдельная подпись
# защищала бы лишь от кражи самого аккаунта (см. заголовок update.rs). Крейт
# оставался в сборке всех платформ ради нуля вызовов.
# Скачивание обновлений по HTTPS. hyper и rustls УЖЕ в дереве — берём тонкую
# обвязку поверх них, а не тяжёлый универсальный клиент.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "webpki-tokio", "ring", "tls12"] }
http-body-util = "0.1"

[dev-dependencies]
# Виртуальные часы: сроки тишины здесь измеряются секундами, и без
# `start_paused` их тесты шли бы восемь секунд каждый.
tokio = { workspace = true, features = ["test-util"] }
