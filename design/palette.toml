# ИСТОЧНИК ПАЛИТРЫ — ОДИН НА ЧЕТЫРЕ ОБОЛОЧКИ.
#
# ЧТО ЭТО. Единственное место, где живут цвета и доли приложения. Отсюда они
# механически раскладываются по четырём темам на четырёх языках:
#   apps/bmv-gui/ui/theme.slint                     (окно, Slint)
#   apps/ios/BeMyVPN/Theme.swift                    (iPhone, SwiftUI)
#   apps/android/app/src/main/java/org/bemyvpn/Theme.kt  (Android, Compose)
#   apps/bmv-cli/src/tui.rs                         (терминал, ratatui)
#
# КОГДА ЗАПУСКАТЬ. Поменял здесь хоть байт — сразу:
#     python3 design/sync-palette.py
# Скрипт перепишет размеченные участки всех четырёх тем. Второй запуск подряд не
# меняет ничего: он идемпотентен, и это проверяется.
#
# ПОЧЕМУ НЕ ГЕНЕРАТОР В СБОРКЕ. Генератор означал бы шаг сборки сразу в четырёх
# тулчейнах (build.rs, фаза в Xcode, задача в Gradle) плюс сгенерированные файлы
# в истории. Цветов десяток, меняются раз в месяц. Скрипт руками плюс сторож
# (`apps/bmv-gui/tests/palette_is_one_source.rs`, краснеет, если тема разошлась с
# этим файлом) дают почти всю пользу за малую долю возни.
#
# ФОРМАТ. Плоский: `ключ = значение  # роль по-русски`. Разбирают его сам скрипт
# и сторож — по двенадцать строк каждый, потому и не понадобилось тащить в два
# тулчейна разбор полного TOML ради файла из тридцати строк.

# ── ЦВЕТА ────────────────────────────────────────────────────────────────────
# Лестница поверхностей: пять ступеней, фон нейтральный (уголь без тона). Шаги:
# 4.2 / 2.4 / 2.0 / 8.2 по CIE L*. «Парящее» НАМЕРЕННО между s2 и s3: выше
# карточек списка, но ниже плиток внутри себя.
#
# ПАРЯЩЕЕ ОПУЩЕНО ЕЩЁ НА 2.89 L* (13.99 → 11.10). Прошлый заход опустил его на
# 1.95 (15.94 → 13.99), это заметили и оставили — и попросили дальше вниз: панель
# состояния занимает верхнюю треть экрана сплошной заливкой, и чем она темнее,
# тем меньше спорит с тем, ради чего на неё смотрят (цифры и круг состояния).
#
# ВМЕСТЕ С НЕЙ ОПУЩЕНЫ ОБЕ КАРТОЧКИ, И ЭТО НЕ ПОБОЧНЫЙ ЭФФЕКТ, А УСЛОВИЕ. Между
# страницей (2.45) и плиткой (19.31) помещаются ровно три ступени. Опустив одну
# только панель, s2 (раскрытая карточка, 11.60) оказалась бы ВЫШЕ неё — панель
# перестала бы читаться как поднятый слой, а именно за это её и вернули тёмной
# прошлый раз. Поэтому вниз поехали s1 (−1.50) и s2 (−2.54).
#
# ЗАПАС РОЗДАН ПО ЧАСТОТЕ ВЗГЛЯДА, А НЕ ПОРОВНУ. Самый широкий шаг оставлен там,
# где он работает каждую секунду:
#   s0→s1       4.19  карточки на странице — это весь список, на него и смотрят;
#   s1→s2       2.42  свёрнутая → раскрытая: они не рядом, а СМЕНЯЮТ друг друга
#                     за 200мс, и вместе со ступенью меняется кромка (на мятную);
#   s2→парящее  2.04  самый узкий и самый безопасный: они НИГДЕ не соприкасаются
#                     — парящий слой всегда окружён ореолом в цвет страницы, так
#                     что рядом их не увидеть;
#   парящее→s3  8.21  плитки лежат прямо НА панели, их перепад виден в каждом
#                     кадре, и на опущенной панели он стал только внятнее.
#
# s3 НЕ ТРОНУТА НАРОЧНО: это самая светлая поверхность приложения, и именно она
# держит потолок по контрасту для всего приложения (худшая подпись — красный,
# 5.27 при пороге 4.5). Опустив её вслед за остальными, мы бы ничего не выиграли
# глазом и потеряли бы единственный замер, который нельзя переступать.
[colors]
bg      = "#08090B"  # s0 — страница
card    = "#121519"  # s1 — карточка списка, поле ввода, кнопка «поделиться»
card_hi = "#161A1F"  # s2 — раскрытая карточка, чип
tile    = "#2A2F39"  # s3 — плитка внутри панели или карточки
float   = "#1A1E24"  # парящее: панель состояния и нав-бар
accent  = "#2FE0A8"  # мята: и «это можно нажать», и «это работает»
fg      = "#EDF1F8"  # основной текст
dim     = "#A5AAB5"  # второстепенный текст и «выключено»
red     = "#FF7974"  # беда, которая сама не пройдёт
amber   = "#F5B14C"  # беда, которая пройдёт сама

# ── КРОМКИ: ИХ РОВНО ПЯТЬ, И БОЛЬШЕ НЕ БЫВАЕТ ────────────────────────────────
# Не запрет, а исчерпывающий список: любая рамка в приложении — одна из пяти.
# Раньше кромка невыбранного была написана в двадцати девяти местах пятью
# разными числами, и оболочки успели разойтись: в окне стояло `#FFFFFF14`
# (0.0784) там, где на телефонах 0.08.
[edges]
hairline       = 0.08  # 1. кромка невыбранного на карточке и на плитке
hairline_float = 0.05  # 2. кромка парящего слоя — там она обязана быть тише
edge           = 0.4   # 3. кромка выбранного
edge_bright    = 0.7   # 3б. она же, когда заливке подниматься уже некуда (курсор, палец)
edge_soft      = 0.28  # 4. кромка крупного подкрашенного блока (раскрытая карточка, плашка)
edge_done      = 0.5   # 5. кромка «получилось» — на время вспышки «Скопировано»
disc_fill      = 0.13  # заливка диска состояния
disc_ring      = 0.3   # кольцо диска состояния

# ── ПАРЯЩИЙ СЛОЙ: ОДНО ОПИСАНИЕ НА ОБА БЛОКА И НА ВСЕ ЧЕТЫРЕ ОБОЛОЧКИ ────────
# Панель состояния и нав-бар — ОДИН слой, и отделка у них одна: заливка `float`,
# кромка `hairline_float`, скругление `radius` и ореол шириной `veil` по
# контуру. Отличается ровно ОДНО — сторона, с которой подъезжает содержимое; она
# живёт параметром оболочки (`up` в Swift, `lift-up` в Slint), а НЕ вторым
# набором чисел.
#
# ── ТЕНИ ЗДЕСЬ БОЛЬШЕ НЕТ, И ЭТО ЗАМЕР НА ТРЁХ ЖИВЫХ ЭКРАНАХ ─────────────────
# Страница `#08090B` — это 8/255, до чистого чёрного восемь единиц, и глубже
# чёрная тень упасть НЕ МОЖЕТ. Одна и та же кромка панели под увеличением:
#   iPhone   фон 8 → 6  (2 единицы из 255), возврат к фону на 13.3 pt
#   окно     фон 8 → 5  (3 единицы),        возврат к фону на  8.5 px
#   Android  тени не было вовсе
# Просьба «в половину слабее» упирается в ОДНУ единицу из 255 — меньше шага
# квантования: тень стала бы невидимой, но осталась бы РАЗНОЙ. Три одинаковых
# числа давали вылет 13.3 против 8.5, потому что `radius` у SwiftUI и
# `drop-shadow-blur` у Slint — разные величины, и пересчёт «×2» был неверен.
# Поэтому тень убрана как ПОНЯТИЕ, а не ослаблена. Высоту держат перепад заливки
# (8.65 по L* к странице, 4.46 к карточке списка), кромка и ореол — ровно то, чем
# Android жил всегда и на что на него ни разу не жаловались.
#
# ── ПОЧЕМУ РАДИУС И ЗАВЕСА ЛЕЖАТ ЗДЕСЬ, А НЕ В ТРЁХ ФАЙЛАХ ──────────────────
# Они уже расходились: у нав-бара стоял радиус 28 при 22 у панели, и это была не
# мелочь формы — ширина сплошной части ореола считается ОТ РАДИУСА по R·(√2−1),
# так что два края одного слоя гасили по-разному. Теперь оба числа приезжают в
# три темы из одного места, и сторож краснеет, если оболочки разъедутся снова.
[float]
radius = 22  # скругление панели и нав-бара
veil   = 18  # вылет гашения от контура наружу; отступы прокрутки считаются от него

# ── ПОДКРАСКА ВЫБРАННОГО ─────────────────────────────────────────────────────
# Выбранное = СВОЯ СТУПЕНЬ (s1) ПЛЮС ПОДКРАСКА, а не подкраска поверх страницы:
# прозрачность смешивается с тем, что СЗАДИ, и выбранное выходило темнее
# невыбранного.
#
# СИЛА ПРИВЯЗАНА НЕ К ЧИСЛУ, А К ПЛИТКЕ: выбранное обязано встать НА ВЕРХНЮЮ
# ступень, а не перепрыгнуть её. Пока s1 была 8.14, вровень с плиткой (19.31)
# вставало 0.14; s1 опустилась до 6.64 — и то же 0.14 дало бы 18.17, то есть
# выбранное провалилось бы ПОД плитку. 0.155 возвращает 19.36. Меняется s1 —
# пересчитывается и это число, иначе правило «ступень плюс подкраска» держится
# на совпадении, а не на замере.
[mix]
picked  = 0.155  # выбранное/включённое: подкраска в полную силу
touched = 0.06   # крупный подкрашенный блок: полная сила утопила бы содержимое

# ── ВРЕМЯ ────────────────────────────────────────────────────────────────────
[timing]
copied_ms = 1300  # сколько держится «Скопировано»/«Готово» (было 1300 ×13 и 1400 ×2)

# ── БРЕНД «ЗВЕНО» ────────────────────────────────────────────────────────────
# ЭТО НЕ ЧАСТЬ ПАЛИТРЫ И ПАЛИТРЕ НЕ ПОДЧИНЯЕТСЯ: логотип не перекрашивается
# вслед за темой (см. brand/README.md — «не перекрашивать половинки»). Здесь он
# записан затем, чтобы канон лежал не только в SVG: сторож сверяет эти четыре
# числа с `brand/logo.svg` и с андроидной adaptive-иконкой. Темы их НЕ ЧИТАЮТ —
# ни одной оболочке логотип в разметке не нужен.
[brand]
ring_guest_top    = "#6EA2FF"  # кольцо гостя, верх градиента
ring_guest_bottom = "#3D6FE0"  # кольцо гостя, низ градиента
ring_host_top     = "#3EE6A8"  # кольцо хоста, верх градиента
ring_host_bottom  = "#14B981"  # кольцо хоста, низ градиента
