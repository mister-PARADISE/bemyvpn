# ИСТОЧНИК ПАЛИТРЫ — ОДИН НА ЧЕТЫРЕ ОБОЛОЧКИ.
#
# ЧТО ЭТО. Единственное место, где живут цвета и доли приложения. Отсюда они
# механически раскладываются по четырём темам на четырёх языках:
#   apps/bmv-gui/ui/theme.slint                     (окно, Slint)
#   apps/ios/BeMyVPN/Theme.swift                    (iPhone, SwiftUI)
#   apps/android/app/src/main/java/org/bemyvpn/Theme.kt  (Android, Compose)
#   apps/bmv-cli/src/tui.rs                         (терминал, ratatui)
#
# КОГДА ЗАПУСКАТЬ. Поменял здесь хоть байт — сразу:
#     python3 design/sync-palette.py
# Скрипт перепишет размеченные участки всех четырёх тем. Второй запуск подряд не
# меняет ничего: он идемпотентен, и это проверяется.
#
# ПОЧЕМУ НЕ ГЕНЕРАТОР В СБОРКЕ. Генератор означал бы шаг сборки сразу в четырёх
# тулчейнах (build.rs, фаза в Xcode, задача в Gradle) плюс сгенерированные файлы
# в истории. Цветов десяток, меняются раз в месяц. Скрипт руками плюс сторож
# (`apps/bmv-gui/tests/palette_is_one_source.rs`, краснеет, если тема разошлась с
# этим файлом) дают почти всю пользу за малую долю возни.
#
# ФОРМАТ. Плоский: `ключ = значение  # роль по-русски`. Разбирают его сам скрипт
# и сторож — по двенадцать строк каждый, потому и не понадобилось тащить в два
# тулчейна разбор полного TOML ради файла из тридцати строк.

# ── ЦВЕТА ────────────────────────────────────────────────────────────────────
# Лестница поверхностей: пять ступеней, фон нейтральный (уголь без тона). Шаги
# разведены и идут по порядку: 5.7 / 4.5 / 3.3 / 3.4 по CIE L*. «Парящее»
# НАМЕРЕННО между s2 и s3: выше карточек списка, но ниже плиток внутри себя.
[colors]
bg      = "#08090B"  # s0 — страница
card    = "#15181D"  # s1 — карточка списка, поле ввода, кнопка «поделиться»
card_hi = "#1D2128"  # s2 — раскрытая карточка, чип
tile    = "#2A2F39"  # s3 — плитка внутри панели или карточки
float   = "#232830"  # парящее: панель состояния и нав-бар
accent  = "#2FE0A8"  # мята: и «это можно нажать», и «это работает»
fg      = "#EDF1F8"  # основной текст
dim     = "#A5AAB5"  # второстепенный текст и «выключено»
red     = "#FF7974"  # беда, которая сама не пройдёт
amber   = "#F5B14C"  # беда, которая пройдёт сама

# ── КРОМКИ: ИХ РОВНО ПЯТЬ, И БОЛЬШЕ НЕ БЫВАЕТ ────────────────────────────────
# Не запрет, а исчерпывающий список: любая рамка в приложении — одна из пяти.
# Раньше кромка невыбранного была написана в двадцати девяти местах пятью
# разными числами, и оболочки успели разойтись: в окне стояло `#FFFFFF14`
# (0.0784) там, где на телефонах 0.08.
[edges]
hairline       = 0.08  # 1. кромка невыбранного на карточке и на плитке
hairline_float = 0.05  # 2. кромка парящего слоя — там она обязана быть тише
edge           = 0.4   # 3. кромка выбранного
edge_bright    = 0.7   # 3б. она же, когда заливке подниматься уже некуда (курсор, палец)
edge_soft      = 0.28  # 4. кромка крупного подкрашенного блока (раскрытая карточка, плашка)
edge_done      = 0.5   # 5. кромка «получилось» — на время вспышки «Скопировано»
disc_fill      = 0.13  # заливка диска состояния
disc_ring      = 0.3   # кольцо диска состояния

# ── ПОДКРАСКА ВЫБРАННОГО ─────────────────────────────────────────────────────
# Выбранное = СВОЯ СТУПЕНЬ (s1) ПЛЮС ПОДКРАСКА, а не подкраска поверх страницы:
# прозрачность смешивается с тем, что СЗАДИ, и выбранное выходило темнее
# невыбранного. 0.14 даёт мяте L* 19.54 при s3 = 19.31 — ровно вровень с плиткой.
[mix]
picked  = 0.14  # выбранное/включённое: подкраска в полную силу
touched = 0.06  # крупный подкрашенный блок: полная сила утопила бы содержимое

# ── ВРЕМЯ ────────────────────────────────────────────────────────────────────
[timing]
copied_ms = 1300  # сколько держится «Скопировано»/«Готово» (было 1300 ×13 и 1400 ×2)

# ── БРЕНД «ЗВЕНО» ────────────────────────────────────────────────────────────
# ЭТО НЕ ЧАСТЬ ПАЛИТРЫ И ПАЛИТРЕ НЕ ПОДЧИНЯЕТСЯ: логотип не перекрашивается
# вслед за темой (см. brand/README.md — «не перекрашивать половинки»). Здесь он
# записан затем, чтобы канон лежал не только в SVG: сторож сверяет эти четыре
# числа с `brand/logo.svg` и с андроидной adaptive-иконкой. Темы их НЕ ЧИТАЮТ —
# ни одной оболочке логотип в разметке не нужен.
[brand]
ring_guest_top    = "#6EA2FF"  # кольцо гостя, верх градиента
ring_guest_bottom = "#3D6FE0"  # кольцо гостя, низ градиента
ring_host_top     = "#3EE6A8"  # кольцо хоста, верх градиента
ring_host_bottom  = "#14B981"  # кольцо хоста, низ градиента
