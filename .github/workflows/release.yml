name: Release

# Пуш тега vX.Y → собираем сборки и кладём в Releases.
# Ручной прогон (workflow_dispatch) — только сборка, без публикации (проверка).
#
# ВСЁ собирается здесь: репозиторий публичный, значит стандартные раннеры
# бесплатны и держать свою машину для сборки не нужно ни для одного файла.
#
# ПРАВИЛО АССЕТОВ: никаких архивов — каждый файл скачал и запустил.
# ЕДИНЫЙ ПАТТЕРН ИМЁН: bemyvpn-<os>-<arch>[-terminal].<ext>
#   приложение (GUI) — БЕЗ суффикса; терминал/сервер — с суффиксом `-terminal`.
#   bemyvpn-android-arm64.apk               Android-приложение     (CI)
#   bemyvpn-linux-x86_64.AppImage           Linux-приложение      (CI)
#   bemyvpn-windows-x86_64.exe              Windows-приложение     (CI)
#   bemyvpn-linux-x86_64-terminal           терминал/сервер Linux (CI)
#   bemyvpn-windows-x86_64-terminal.exe     терминал Windows       (CI)
#   bemyvpn-macos-arm64.dmg                 macOS-приложение       (CI)
#   bemyvpn-macos-arm64-terminal            терминал macOS         (CI)
# wintun.dll ВШИТА в Windows-exe (bmv-desktop::ensure_wintun) — отдельного файла нет.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Описание релиза («что скачать») — создаёт/обновляет тело релиза.
  # Заметки к релизу. Главное здесь — СПИСОК ИЗМЕНЕНИЙ: он собирается из коммитов
  # между прошлым и текущим тегом, поэтому у каждой версии он свой (раньше текст
  # был захардкожен и одинаков для всех релизов — бесполезен).
  # Идёт последним: ждёт сборки, чтобы посчитать sha256 готовых файлов.
  notes:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [cli, gui-macos, android, gui-linux, gui-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна вся история и теги, иначе списка изменений не будет
      - name: "Build release notes"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          # sed, а НЕ head: head закрывает канал после N строк, писатель слева
          # получает SIGPIPE, и при `set -o pipefail` падает весь шаг.
          # `|| true` обязателен: на ПЕРВОМ релизе тег ровно один, grep не находит
          # ничего и возвращает 1 — под `set -e` это убивало весь шаг.
          PREV=$(git tag --sort=-creatordate | grep -v "^$TAG$" | sed -n 1p || true)

          echo "## Что нового" > notes.md
          echo >> notes.md
          if [ -n "$PREV" ]; then
            # Только заголовки коммитов (тело — многострочное, в список не годится).
            ALL=$(git log --no-merges --pretty=format:'- %s' "$PREV..$TAG")
            # Внутренняя кухня (chore/docs/ci/test) пользователю не интересна —
            # но если после фильтра пусто, показываем всё, чтобы раздел не был пустым.
            USER_FACING=$(printf '%s\n' "$ALL" | grep -vE '^- (chore|docs|ci|test)(\(.*\))?:' || true)
            LIST="${USER_FACING:-$ALL}"
            # Между релизами бывает и сотня коммитов — простыня на странице релиза
            # так же бесполезна, как пустота. Показываем свежие, остальное — ссылкой.
            TOTAL=$(printf '%s\n' "$LIST" | wc -l | tr -d ' ')
            printf '%s\n' "$LIST" | sed -n '1,20p' >> notes.md
            if [ "$TOTAL" -gt 20 ]; then
              echo >> notes.md
              echo "<sub>…и ещё $((TOTAL - 20)) изменений.</sub>" >> notes.md
            fi
            echo >> notes.md
            echo "Все изменения: [\`$PREV\` → \`$TAG\`](https://github.com/$REPO/compare/$PREV...$TAG)" >> notes.md
          else
            echo "Первый релиз." >> notes.md
          fi

          cat >> notes.md <<'MD'

          ---

          ## Что это такое

          **BeMyVPN — бесплатный VPN без серверов-посредников.** Один человек
          (**хост**) делится своим интернетом, другой (**гость**) через него выходит
          в сеть. Трафик идёт **напрямую между устройствами** — сервер проекта
          (**координатор**) только помогает вам найти друг друга и самих данных
          не видит.

          Подключение — по короткому коду хоста или выбором из списка открытых
          хостов. Регистрация не нужна.

          ## Какой файл скачать

          ### 1. Просто пользоваться — приложение с кнопками

          Обычная программа: открыл, нажал. Умеет и подключаться к чужому хосту,
          и раздавать свой интернет.

          | Система | Файл |
          |---|---|
          | **Android** | `bemyvpn-android-arm64.apk` |
          | **macOS** (Apple Silicon) | `bemyvpn-macos-arm64.dmg` |
          | **Windows** | `bemyvpn-windows-x86_64.exe` |
          | **Linux** | `bemyvpn-linux-x86_64.AppImage` |

          ### 2. Для сервера — терминальная версия

          **Linux и macOS — одна команда, качать вручную не нужно:**

          ```
          curl -fsSL https://raw.githubusercontent.com/mister-PARADISE/bemyvpn/main/install.sh | sh
          ```

          Установщик подберёт файл под систему, положит в `PATH` и проверит, что
          запускается. Дальше программа зовётся просто `bemyvpn` — из любой папки,
          а обновляется командой `bemyvpn update`.

          Либо вручную, файлом из списка ниже:

          Тот же проект без графики, меню прямо в консоли. **Один файл совмещает
          все три роли:** гость (подключиться), хост 24/7 (раздавать) и
          собственный координатор (`bemyvpn server`) — если не хотите зависеть
          от чужого сервера, поднимите свой.

          | Система | Файл |
          |---|---|
          | **Linux (терминал)** | `bemyvpn-linux-x86_64-terminal` |
          | **macOS (терминал)** | `bemyvpn-macos-arm64-terminal` |
          | **Windows (терминал)** | `bemyvpn-windows-x86_64-terminal.exe` |

          Архивов и установщиков нет: скачали файл — запустили.

          ## Что важно знать до запуска

          | | |
          |---|---|
          | **macOS, первый запуск** | Правый клик по программе → «Открыть». Приложение не подписано **намеренно** — платный сертификат Apple не используется. Дальше открывается обычным двойным кликом. |
          | **Linux и терминал** | Перед первым запуском разрешить исполнение: `chmod +x <файл>` |
          | **Права администратора** | Нужны **только гостю** — система создаёт сетевой интерфейс. Хосту и координатору не нужны. |
          | **Чтобы стать хостом** | Нужен **белый (публичный) IP**. За NAT — домашний роутер, мобильный интернет — раздавать нельзя, координатор такой хост отклонит. Подходит любой VPS. |
          | **Настройка** | Терминал без аргументов открывает меню, всё сохраняется само. Конфиг руками писать не нужно. |

          ## Проверка скачанного

          Файлы не подписаны, поэтому сверьте хэш — так вы убедитесь, что скачали
          именно то, что собрал этот релиз:

          | Система | Команда |
          |---|---|
          | Linux | `sha256sum <файл>` |
          | macOS | `shasum -a 256 <файл>` |
          | Windows | `certutil -hashfile <файл> SHA256` |

          MD

          gh release download "$TAG" -R "$REPO" -D dl
          echo '```' >> notes.md
          ( cd dl && sha256sum * ) >> notes.md
          echo '```' >> notes.md
      - name: "Publish notes"
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md

  # bemyvpn (CLI + TUI + режим сервера) — ГОЛЫЙ бинарь под каждую ОС, без архивов.
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: bemyvpn-linux-x86_64-terminal
            bin: bemyvpn
          - os: windows-latest
            asset: bemyvpn-windows-x86_64-terminal.exe
            bin: bemyvpn.exe
            pe: x86_64          # что должно стоять в заголовке PE — см. шаг проверки
          - os: macos-latest
            asset: bemyvpn-macos-arm64-terminal
            bin: bemyvpn
          # ── ARM-машины. Собираем на РОДНЫХ ARM-раннерах, а не кросс-компиляцией:
          # у нас в зависимостях есть Си (rustls, кольцо), и кросс-сборка тянула бы
          # чужие тулчейны ради того, что бесплатный ARM-раннер делает сам.
          - os: ubuntu-24.04-arm
            asset: bemyvpn-linux-arm64-terminal
            bin: bemyvpn
          - os: windows-11-arm
            asset: bemyvpn-windows-arm64-terminal.exe
            bin: bemyvpn.exe
            pe: ARM64
          # Intel-маков здесь НЕТ, и это осознанно.
          #
          # Ярлык macos-13 GitHub вывел из эксплуатации 4 декабря 2025. Задача с
          # ним не встаёт в очередь за машиной — она уходит В НИКУДА: Actions не
          # узнаёт метку, считает её чужим самодельным раннером и ждёт вечно
          # (в ответе API у таких задач пустая группа раннеров и ноль шагов).
          # Пять релизов подряд, v1.20…v1.24, из-за этого вышли БЕЗ ОПИСАНИЯ:
          # задача notes ждёт needs: [cli, gui-macos], а те висели вечно.
          #
          # Живая замена есть (macos-15-intel, бесплатна до августа 2027), но
          # брать её сейчас неправильно: Intel-мака у нас нет, запуск проверить
          # нечем, и мы выложили бы файл, который не исполнил ни один процессор.
          # Неработающий файл хуже честного «не поддерживается» — install.sh
          # говорит это прямым текстом. Вернёмся, когда появится живая машина
          # или хотя бы один пользователь с Intel.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        shell: bash
        run: BMV_VERSION="${GITHUB_REF_NAME#v}" cargo build --release -p bmv-cli
      - name: Rename asset
        shell: bash
        run: cp "target/release/${{ matrix.bin }}" "${{ matrix.asset }}"
      # ── Windows-половина проверок. Те же сторожа, что у окна: терминал уезжает
      # людям тем же файлом и точно так же не запустится без вшитого рантайма.
      - name: Defender scan (report only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File tools/scan-defender.ps1 "${{ matrix.asset }}"
      - name: Upload artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: ${{ matrix.asset }}
      - name: Verify exe (arch + static CRT)
        if: runner.os == 'Windows'
        shell: bash
        run: python tools/check-windows-exe.py "${{ matrix.asset }}" "${{ matrix.pe }}"
      # Версия в свойствах файла против версии, которую печатает САМА программа.
      # Их считают разные механизмы (ресурс из build.rs и option_env! в
      # bmv-common), а источник обязан быть один — BMV_VERSION.
      - name: Verify version info
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $vi = (Get-Item "${{ matrix.asset }}").VersionInfo
          $vi | Format-List * | Out-String | Write-Host
          $said = (& ".\${{ matrix.asset }}" version | Select-Object -First 1).Trim()
          Write-Host "program says: '$said', file properties say: '$($vi.FileVersion)'"
          if ($vi.FileVersion -ne $said) { Write-Host "FAIL: version mismatch"; exit 1 }
          if (-not $vi.ProductName) { Write-Host "FAIL: ProductName is empty"; exit 1 }
          Write-Host "OK: version info matches the program"
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true

  # macOS GUI как .dmg. Подпись АД-ХОК (сертификата нет и не надо): первый запуск
  # правым кликом → «Открыть». Собирается тут, а не локально — тогда для выпуска
  # релиза не нужна ни одна своя машина.
  gui-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]   # только Apple Silicon — см. комментарий в матрице cli
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # build-app.sh только упаковывает — бинарь должен уже лежать в target/release.
      - name: Build GUI
        shell: bash
        run: BMV_VERSION="${GITHUB_REF_NAME#v}" cargo build --release -p bmv-gui
      - name: Package dmg
        run: VERSION="${GITHUB_REF_NAME#v}" BMV_VERSION="${GITHUB_REF_NAME#v}" bash packaging/macos/build-app.sh
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Маска, а не жёсткое имя: build-app.sh называет файл по архитектуре
          # машины, и при любой второй архитектуре сюда приезжало бы имя, которого
          # нет. Без флага ниже такой промах ТИХИЙ — задача «успешна», файла нет.
          files: dist/*.dmg
          fail_on_unmatched_files: true

  # Android APK (arm64, sideload — ставится файлом, магазин не нужен). Rust-часть
  # собирает cargo-ndk, обёртку — gradle. Раннер чужой, поэтому путей сборочной
  # машины в .so не остаётся (локальные сборки этим страдали, см. build-apk.sh).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build native lib
        working-directory: apps/android/rust
        run: |
          # На раннере NDK предустановлен, но переменная называется по-разному —
          # подставляем запасные, только если основная пуста.
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk-bundle}}"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
      # ПОСТОЯННЫЙ ключ подписи. Без него gradle падает на отладочный ключ, а он
      # генерируется на каждом раннере заново — у каждого релиза своя подпись, и
      # Android отказывается ставить обновление поверх («Приложение не
      # установлено»). Секрета нет → шаг просто пропускается, сборка не ломается.
      - name: Restore signing key
        # Проверка наличия ключа — В СКРИПТЕ, а не в `if`. Ни `secrets`, ни env
        # самого шага в условии не годятся: `if` вычисляется ДО применения env
        # этого шага, и ключ мог бы молча не подставиться, а APK уехать с
        # отладочной подписью. В шелле переменная точно на месте.
        working-directory: apps/android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Ключа подписи нет — APK уйдёт с ОТЛАДОЧНОЙ подписью, обновление поверх не встанет"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "ключ подписи на месте ($(wc -c < release.jks) байт)"
      - name: Build APK
        working-directory: apps/android
        run: BMV_VERSION="${GITHUB_REF_NAME#v}" ./gradlew assembleRelease
      # Ключ и пароли не должны пережить джоб даже в кеше рабочей папки.
      - name: Wipe signing key
        if: always()
        working-directory: apps/android
        run: rm -f release.jks keystore.properties
      - name: Rename asset
        run: cp apps/android/app/build/outputs/apk/release/app-release.apk bemyvpn-android-arm64.apk
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bemyvpn-android-arm64.apk
          fail_on_unmatched_files: true

  # Linux-GUI как ОДИН файл (AppImage) — «APK для Linux»: скачал, chmod +x,
  # запустил, без apt/сервисов/зависимостей. LTO выключен — Slint иначе жрёт память.
  gui-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build deps (Slint femtovg/GL + rsvg)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libxcb1-dev libx11-dev libgl1-mesa-dev libegl1-mesa-dev librsvg2-bin
      - name: Build GUI
        shell: bash
        run: BMV_VERSION="${GITHUB_REF_NAME#v}" cargo build --release -p bmv-gui
      - name: Package AppImage
        run: VERSION="${GITHUB_REF_NAME#v}" bash packaging/linux/build-appimage.sh dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bemyvpn-appimage-${{ matrix.os }}
          path: dist/*.AppImage
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          fail_on_unmatched_files: true

  # GUI под Windows — голый exe, wintun.dll вшита в бинарь (распаковывается сама).
  # macOS (.dmg) собирается локально на Маке — см. шапку файла (экономия ×10).
  gui-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
            pe: x86_64
          - os: windows-11-arm
            arch: arm64
            pe: ARM64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build GUI
        shell: bash
        run: BMV_VERSION="${GITHUB_REF_NAME#v}" cargo build --release -p bmv-gui
      # Имя берём ИЗ МАТРИЦЫ, а не из `uname -m`.
      #
      # На Windows-ARM оболочка работает через эмуляцию и честно отвечает
      # «x86_64» — проверка по uname провалилась молча, ARM-сборка назвалась
      # именем x86_64 и поехала в релиз поверх настоящей x86_64. Уцелело чудом:
      # какая задача успела последней, та и осталась. Матрица знает архитектуру
      # достоверно, гадать по среде незачем.
      - name: Rename exe
        shell: bash
        run: cp target/release/bemyvpn-gui.exe "bemyvpn-windows-${{ matrix.arch }}.exe"
      # Антивирус — ПРЕДУПРЕЖДАЕТ, НЕ РОНЯЕТ (см. шапку скрипта). Стоит до
      # сторожей, чтобы имя срабатывания попадало в журнал даже когда сборка
      # признана негодной по другой причине.
      - name: Defender scan (report only)
        shell: pwsh
        run: pwsh -File tools/scan-defender.ps1 "bemyvpn-windows-${{ matrix.arch }}.exe"
      # Выгрузка ДО сторожей: если сторож покраснеет, файл всё равно можно
      # скачать и рассмотреть, а не собирать заново ради одной таблицы импортов.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-windows-${{ matrix.os }}
          path: bemyvpn-windows-*.exe
      # Сторож готового файла: архитектура из заголовка PE (ARM-сборка однажды
      # уехала в релиз под именем x86_64) и отсутствие внешнего рантайма MSVC
      # (ARM-сборка уехала без вшитого vcruntime и не запустилась у человека).
      # Проверяем ФАЙЛ, а не .cargo/config.toml: конфиг может быть правильным, а
      # флаг — не доехать (RUSTFLAGS из окружения вытесняет секции целиком).
      - name: Verify exe (arch + static CRT)
        shell: bash
        run: python tools/check-windows-exe.py "bemyvpn-windows-${{ matrix.arch }}.exe" "${{ matrix.pe }}"
      # Сведения о файле: непустые и той же версии, что и тег. Пустые свойства —
      # это и голая строка в Проводнике, и лишний повод для SmartScreen.
      - name: Verify version info
        shell: pwsh
        run: |
          $vi = (Get-Item "bemyvpn-windows-${{ matrix.arch }}.exe").VersionInfo
          $vi | Format-List * | Out-String | Write-Host
          $want = "${{ github.ref_name }}" -replace '^v', ''
          if ($vi.FileVersion -ne $want) {
            Write-Host "FAIL: FileVersion is '$($vi.FileVersion)', expected '$want'"
            exit 1
          }
          if (-not $vi.ProductName) { Write-Host "FAIL: ProductName is empty"; exit 1 }
          Write-Host "OK: version info matches $want"
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bemyvpn-windows-*.exe
          fail_on_unmatched_files: true
