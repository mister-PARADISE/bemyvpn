name: CI

# Тесты и линтер на каждый пуш и PR.
#
# Зачем отдельно от release.yml: там ТОЛЬКО сборка. До этого прогона тесты не
# гонял никто, кроме разработчика на своей машине, — то есть сломанный крейт
# спокойно доезжал до тега и выпускался. Теперь красный CI виден до релиза.
#
# Тесты гоняются только на ubuntu: логика платформенно-независима, а раннеры
# Linux дешёвые (и бесплатные для публичного репозитория) — гонять одно и то же
# на трёх ОС значит платить втрое за один результат.
#
# А вот СБОРКА под Windows — отдельный вопрос: её проверял только release.yml,
# то есть о поломке узнавали в момент выпуска, когда чинить уже поздно. Поэтому
# ниже есть дешёвый `cargo check` на windows-latest: он ловит то, чего Linux не
# видит (пути, зависимости под cfg(windows), wintun), и не тратит время на
# линковку релиза.
#
# По той же причине здесь собирается и Android (job `android`): Kotlin не
# компилировал ни `cargo test`, ни линтер, а APK делался только по тегу.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Слинт-GUI входит в workspace, поэтому его системные зависимости нужны
      # даже для `cargo test` (сборка build.rs и линковка).
      # Список ОДИН В ОДИН с job'ом gui-linux в release.yml — он заведомо рабочий,
      # и расхождение означало бы, что CI зелёный, а релиз не собирается.
      - name: Системные зависимости (Slint femtovg/GL + rsvg)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libxcb1-dev libx11-dev libgl1-mesa-dev libegl1-mesa-dev librsvg2-bin

      - name: Тесты (workspace)
        run: cargo test --workspace

      # Координатор НАМЕРЕННО вне workspace (свои зависимости, axum), поэтому
      # `--workspace` его не видит и его тесты не запускались ВООБЩЕ. А это
      # ровно тот код, что смотрит в интернет и фильтрует чужие адреса.
      - name: Тесты (координатор)
        run: cargo test --manifest-path server/coordinator/Cargo.toml

      # ФОРК ipstack (vendor/ipstack) тоже вне workspace — он подключается через
      # `[patch.crates-io]`, а патч собирает только библиотеку: его 23 теста не
      # гонял НИКТО. А охраняют они ровно наши правки, давшие ускорение в 7.5–13.5
      # раз (window scaling, восстановление после потерь, адаптивный RTO, закрытие
      # окна приёма) — то есть цену отката молча платил бы человек на телефоне.
      - name: Тесты (форк ipstack)
        run: cargo test --manifest-path vendor/ipstack/Cargo.toml

      - name: Линтер
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Линтер (координатор)
        run: cargo clippy --manifest-path server/coordinator/Cargo.toml --all-targets -- -D warnings

  # Windows-половина: раньше её собирал ТОЛЬКО release.yml по тегу — поломка
  # всплывала в момент выпуска. `check` вместо `build`: он проходит весь разбор
  # и проверку типов (то есть ловит ровно те ошибки, что отличают Windows от
  # Linux), но не линкует и не оптимизирует — минуты против десятков минут.
  #
  # Метка раннера ЖИВАЯ и используется в release.yml. Снятую метку (как когда-то
  # macos-13) брать нельзя: job с ней не падает, а ждёт вечно и молча держит всё,
  # что от него зависит — снаружи это выглядит как пустая группа раннеров и
  # пустой список шагов.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Имена шагов ЛАТИНИЦЕЙ — сознательно, только в этом job'е. На
      # Windows-раннере кириллица в печатаемом выводе уже роняла шаг ошибкой
      # кодировки (см. python-проверку архитектуры в release.yml): проверка
      # отрабатывала верно, а задача падала на сообщении о её успехе.
      # Системных зависимостей, в отличие от Linux, тут не нужно: GUI под
      # Windows собирается голым тулчейном (см. job gui-windows в release.yml).
      # --all-targets и -D warnings ОБЯЗАТЕЛЬНЫ, а не украшение. Голый
      # `cargo check -p bmv-gui` не разбирал тестовый код под Windows и не считал
      # предупреждения ошибками — и уже спрятал настоящую поломку: после правки
      # маршрутов одна константа стала мёртвой в windows-ветке, проект перестал
      # проходить собственную проверку, а эта задача осталась зелёной. Нашли
      # вручную, эмулируя цель через rustc. Второй раз так не проедет.
      #
      # Клиппи вместо check: он включает всё, что делает check, плюс сами
      # замечания, ради которых тут и стоит -D warnings.
      - name: Clippy GUI (Windows)
        run: cargo clippy -p bmv-gui --all-targets -- -D warnings

      # Fork of wintun (vendor/wintun) is excluded from the workspace as well and
      # is Windows-only: on Linux it does not even compile (std::os::windows), so
      # its tests can live in this job and nowhere else.
      - name: Test wintun fork (Windows)
        run: cargo test --manifest-path vendor/wintun/Cargo.toml

  # ── ANDROID ─────────────────────────────────────────────────────────────────
  #
  # Kotlin-код приложения не собирал НИКТО. `cargo test --workspace` его не
  # видит дважды: мост apps/android/rust вынесен из workspace (свой Cargo.lock и
  # patch на форк ipstack), а экраны написаны на Kotlin — это вообще не Rust.
  # APK же собирался ТОЛЬКО по тегу, в release.yml. То есть о поломке в UI
  # узнавали в момент выпуска, когда чинить поздно, — ровно та беда, от которой
  # выше уже закрылись задачей windows-check.
  #
  # Шаги и версии — ОДИН В ОДИН с job'ом android в release.yml: temurin 17,
  # cargo-ndk, цель aarch64-linux-android, тот же подбор ANDROID_NDK_HOME, тот
  # же assembleRelease. Расхождение означало бы зелёную проверку при падающем
  # выпуске, а это хуже отсутствия проверки: на неё полагаются.
  #
  # Почему release, а не debug (тот дешевле минуты на три): debug идёт мимо R8
  # (minifyEnabled + shrinkResources), а срезанный класс или ресурс — поломка,
  # которая существует ТОЛЬКО в релизной сборке. Проверять надо то, что уезжает.
  #
  # Подписи здесь намеренно нет: секреты недоступны в pull_request с форка, а
  # gradle без ключа берёт отладочный (см. app/build.gradle). Для проверки и для
  # запуска на эмуляторе этого хватает, в магазин такой APK не едет.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Мост — ОТДЕЛЬНЫЙ workspace, поэтому кэшу нужно указать его явно: ключ по
      # корневому Cargo.lock не совпал бы ни разу, и каждый прогон собирал бы
      # ядро под новую цель с нуля.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/android/rust
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Нативная библиотека (arm64)
        working-directory: apps/android/rust
        run: |
          # На раннере NDK предустановлен, но переменная называется по-разному —
          # подставляем запасные, только если основная пуста.
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk-bundle}}"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
      # BMV_VERSION не передаём: вне тега версии нет, и build.gradle сам ставит
      # «0.0» — по ней видно, что сборка не из релиза и релизом не притворяется.
      - name: Сборка APK
        working-directory: apps/android
        run: ./gradlew assembleRelease
      # APK артефактом — ради того же, ради чего ниже снимки окна: посмотреть на
      # приложение чужой ОС, не поднимая у себя JDK, SDK и NDK. Ставится на
      # эмулятор как есть.
      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk

  # ── КАК ВЫГЛЯДИТ ОКНО НА ЧУЖИХ ОС ───────────────────────────────────────────
  #
  # Windows и Linux у нас нет, а держать ради одного снимка виртуальную машину —
  # дорого и разово. Раннеры GitHub — это НАСТОЯЩИЕ Windows и Linux, поэтому
  # приложение запускается прямо там и присылает снимок экрана артефактом. Не
  # «когда-нибудь проверим», а на каждый прогон.
  #
  # Почему здесь, а не отдельным файлом: это ровно проверка (тот же повод, те же
  # ветки и PR, тот же кэш Rust). Отдельный workflow означал бы вторую копию
  # триггеров и второй холодный кэш ради двух задач.
  #
  # Обе задачи НЕЗАВИСИМЫ от test/windows-check и ничего у них не меняют. Метки
  # раннеров те же, что уже работают в release.yml (ubuntu-latest, windows-latest),
  # мёртвых меток здесь нет.
  #
  # Сборка РЕЛИЗНАЯ: снимок должен показывать то, что уезжает людям (под Windows
  # у релиза нет консольного окна — windows_subsystem). LTO выключен ровно как в
  # release.yml, иначе Slint съедает память и минуты.
  gui-screenshot-linux:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # К списку из job'а test добавлены: xvfb (экрана у раннера нет),
      # libgl1-mesa-dri (софтверный OpenGL llvmpipe — femtovg рисует через GPU,
      # которого нет), x11-utils+xdotool (найти окно и щёлкнуть по вкладке),
      # imagemagick (снять экран), fluxbox+x11-xserver-utils (заголовок окна,
      # панель задач и цвет фона — иначе «рабочий стол» это чёрное поле),
      # python3-pil (проверка снимков, tools/ci-shot-check.py).
      - name: Системные зависимости (Slint + виртуальный экран + снимок)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libxcb1-dev libx11-dev libgl1-mesa-dev libegl1-mesa-dev librsvg2-bin xvfb libgl1-mesa-dri x11-utils xdotool imagemagick fluxbox x11-xserver-utils python3-pil
      # Терминальный бинарь нужен не «заодно»: он же поднимает локальный
      # координатор и двух хостов, иначе каталог в окне пуст.
      - name: Сборка окна и терминала
        run: cargo build --release -p bmv-gui -p bmv-cli
      - name: Снимки экрана по вкладкам
        run: bash tools/ci-shot-linux.sh shot
      - name: Выложить снимок
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshot-linux
          path: shot/

  gui-screenshot-windows:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Имена шагов и весь вывод скрипта — ЛАТИНИЦЕЙ, как и в windows-check:
      # кириллица в выводе Windows-раннера уже роняла задачу ошибкой кодировки.
      # Рабочий стол у раннера настоящий, виртуальный экран поднимать не нужно.
      # Pillow reads the shots back in tools/ci-shot-check.py. Same checker as
      # the Linux job, so both runners judge a frame by the same numbers.
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Build GUI and CLI
        run: cargo build --release -p bmv-gui -p bmv-cli
      - name: Full-screen shots per tab
        run: pwsh -File tools/ci-shot-windows.ps1 shot
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshot-windows
          path: shot/
