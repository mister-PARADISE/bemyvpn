name: CI

# Тесты и линтер на каждый пуш и PR.
#
# Зачем отдельно от release.yml: там ТОЛЬКО сборка. До этого прогона тесты не
# гонял никто, кроме разработчика на своей машине, — то есть сломанный крейт
# спокойно доезжал до тега и выпускался. Теперь красный CI виден до релиза.
#
# Тесты гоняются только на ubuntu: логика платформенно-независима, а раннеры
# Linux дешёвые (и бесплатные для публичного репозитория) — гонять одно и то же
# на трёх ОС значит платить втрое за один результат.
#
# А вот СБОРКА под Windows — отдельный вопрос: её проверял только release.yml,
# то есть о поломке узнавали в момент выпуска, когда чинить уже поздно. Поэтому
# ниже есть дешёвый `cargo check` на windows-latest: он ловит то, чего Linux не
# видит (пути, зависимости под cfg(windows), wintun), и не тратит время на
# линковку релиза.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Слинт-GUI входит в workspace, поэтому его системные зависимости нужны
      # даже для `cargo test` (сборка build.rs и линковка).
      # Список ОДИН В ОДИН с job'ом gui-linux в release.yml — он заведомо рабочий,
      # и расхождение означало бы, что CI зелёный, а релиз не собирается.
      - name: Системные зависимости (Slint femtovg/GL + rsvg)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libxcb1-dev libx11-dev libgl1-mesa-dev libegl1-mesa-dev librsvg2-bin

      - name: Тесты (workspace)
        run: cargo test --workspace

      # Координатор НАМЕРЕННО вне workspace (свои зависимости, axum), поэтому
      # `--workspace` его не видит и его тесты не запускались ВООБЩЕ. А это
      # ровно тот код, что смотрит в интернет и фильтрует чужие адреса.
      - name: Тесты (координатор)
        run: cargo test --manifest-path server/coordinator/Cargo.toml

      - name: Линтер
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Линтер (координатор)
        run: cargo clippy --manifest-path server/coordinator/Cargo.toml --all-targets -- -D warnings

  # Windows-половина: раньше её собирал ТОЛЬКО release.yml по тегу — поломка
  # всплывала в момент выпуска. `check` вместо `build`: он проходит весь разбор
  # и проверку типов (то есть ловит ровно те ошибки, что отличают Windows от
  # Linux), но не линкует и не оптимизирует — минуты против десятков минут.
  #
  # Метка раннера ЖИВАЯ и используется в release.yml. Снятую метку (как когда-то
  # macos-13) брать нельзя: job с ней не падает, а ждёт вечно и молча держит всё,
  # что от него зависит — снаружи это выглядит как пустая группа раннеров и
  # пустой список шагов.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Имена шагов ЛАТИНИЦЕЙ — сознательно, только в этом job'е. На
      # Windows-раннере кириллица в печатаемом выводе уже роняла шаг ошибкой
      # кодировки (см. python-проверку архитектуры в release.yml): проверка
      # отрабатывала верно, а задача падала на сообщении о её успехе.
      # Системных зависимостей, в отличие от Linux, тут не нужно: GUI под
      # Windows собирается голым тулчейном (см. job gui-windows в release.yml).
      - name: Check GUI (Windows)
        run: cargo check -p bmv-gui
